 exilarchate_elective_succession_law_effects: "The [ruler|E] and all members of [ROOT.GetHerHis] [dynasty|E] can nominate a [title_heir|E] from among the members of the ruler's [dynasty|E] and other claimants to the title of the same [faith|E]."
