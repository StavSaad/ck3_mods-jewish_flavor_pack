l_english:
 # Shtadlanut (intercession) interactions, common/character_interactions/jip_shtadlan_interactions.txt
 jip_shtadlan_readmit_interaction: "Intercede: Readmit the Jews"
 jip_shtadlan_readmit_interaction_desc: "As [shtadlan|E], plead with [recipient.GetShortUIName] to lift [recipient.GetHerHis] edict and let the Jews settle in [recipient.GetHerHis] [realm|E] again."
 jip_shtadlan_protection_interaction: "Intercede: Letter of Protection"
 jip_shtadlan_protection_interaction_desc: "As [shtadlan|E], ask [recipient.GetShortUIName] to take the Jews of [recipient.GetHerHis] [realm|E] under [recipient.GetHerHis] protection, as the bishops and kings of old granted privileges to their communities."
 jip_shtadlan_release_interaction: "Intercede: Release a Prisoner"
 jip_shtadlan_release_interaction_desc: "As [shtadlan|E], ask [recipient.GetShortUIName] to free a Jew held in [recipient.GetHerHis] dungeons. Your own kin are freed first, then the highest-ranking prisoner."
 jip_shtadlan_charter_interaction: "Intercede: Ease the Charter"
 jip_shtadlan_charter_interaction_desc: "As [shtadlan|E], ask your [liege|E] [recipient.GetShortUIName] to lighten the burdens of your charter: jizya is waived, or else your communal taxes are lowered."

 game_concept_shtadlan: "Shtadlan"
 game_concept_shtadlan_desc: "A shtadlan (intercessor) was the man who spoke for a Jewish community before the gentile authorities, pleading against expulsions and taxes and for the release of captives. The head of a [mishpacha|E] family can intercede with any [ruler|E] in [diplomatic_range|E], offering [gold|E], [prestige|E], a [hook|E] on them or a favour owed to them to win them over."

 JIP_SHTADLAN_USE_GOLD: "@gold_icon! Offer a gift of [gold|E]"
 JIP_SHTADLAN_USE_PRESTIGE: "@prestige_icon! Stake your family's [prestige|E]"
 JIP_SHTADLAN_OFFER_HOOK: "[hook_i] Owe [recipient.GetHerHim] a favour"

 JIP_SHTADLAN_REQUEST_REASON: "What you ask: $VALUE|=+0$"
