 # Arameanism's temples (0.15 plan, section 14)
 jip_gp_aramean_faithful_tt:0 "The contributor follows $aramean_pagan$"
 jip_temple_of_aram_enabled_trigger:0 "The holder follows $aramean_pagan$"
 NOT_jip_temple_of_aram_enabled_trigger:0 "The holder does not follow $aramean_pagan$"
