l_english:
 ### Restore the House of Rejoicing: the Temple of Sin at Harran (common/great_projects/types/jip_great_projects.txt)
 great_project_type_jip_gp_temple_of_sin:0 "Restore the House of Rejoicing"
 great_project_type_jip_gp_temple_of_sin_possessive:0 "the House of Rejoicing's"
 great_project_type_jip_gp_temple_of_sin_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_sin$"
 great_project_type_tooltip_jip_gp_temple_of_sin:0 "Rebuild the Ehulhul, the House of Rejoicing, the temple of Sin, Lord of the Moon, at Harran. Nabonidus, last king of Babylon, raised it from its ruins; the Sabians have kept its rites in secret ever since.\n\nWhen it stands, the old gods of Assyria and Harran may be worshipped openly again, and you may proclaim them."
 jip_gp_temple_of_sin_location_tt:0 "Only at Harran, where the Ehulhul stood"
 jip_gp_temple_of_sin_held_tt:0 "Harran is in your realm"
 jip_gp_temple_of_sin_harran_tt:0 "You hold the county of Harran, or your vassal does"
 jip_gp_temple_of_sin_building_tt:0 "The Temple of Sin rises at Harran"
 jip_gp_temple_of_sin_scholar_tt:0 "The contributor has at least #V 12#! [learning|E]"
 jip_gp_temple_of_sin_faithful_tt:0 "The contributor is a Sabian or follows the old gods"

 great_project_type_jip_gp_temple_of_sin_contribution_cedars:0 "Cedars for the Roof"
 great_project_type_jip_gp_temple_of_sin_contribution_cedars_desc:0 "Nabonidus roofed the Ehulhul with beams of cedar from the mountains of Lebanon, and so must its restorer."
 great_project_type_jip_gp_temple_of_sin_contribution_foundation:0 "The Old Foundation Stone"
 great_project_type_jip_gp_temple_of_sin_contribution_foundation_desc:0 "Before he built, Nabonidus dug down to the foundation inscription of the kings before him, so that the temple would rise on its true ground. A scholar must find and read it."
 great_project_type_jip_gp_temple_of_sin_contribution_priests:0 "The Priests of Sin"
 great_project_type_jip_gp_temple_of_sin_contribution_priests_desc:0 "The Sabians who kept the Moon's rites in secret come forward to serve in the new temple."
 great_project_type_jip_gp_temple_of_sin_contribution_crescent:0 "The Silver Crescent"
 great_project_type_jip_gp_temple_of_sin_contribution_crescent_desc:0 "A crescent standard of silver for the Lord of the Moon, to be carried at the head of his processions."
 great_project_type_jip_gp_temple_of_sin_contribution_shrines:0 "The Seven Shrines"
 great_project_type_jip_gp_temple_of_sin_contribution_shrines_desc:0 "Chapels for the seven planets around the great temple, each built in its planet's shape and colour, as the Sabians of Harran remember them."
 great_project_type_jip_gp_temple_of_sin_contribution_terrace:0 "The Star-Readers' Terrace"
 great_project_type_jip_gp_temple_of_sin_contribution_terrace_desc:0 "A terrace on the temple roof where the astrologers of Harran can watch the Moon and the planets."

 # The building (common/buildings/01_jip_buildings.txt)
 building_type_jip_temple_of_sin_01:0 "Temple of Sin"
 building_type_jip_temple_of_sin_01_desc:0 "The Ehulhul, the House of Rejoicing, temple of Sin, Lord of the Moon, at Harran."
 building_jip_temple_of_sin_01:0 "Temple of Sin"
 building_jip_temple_of_sin_01_desc:0 "The Ehulhul stands again at Harran. Cedar beams hold its roof, a silver crescent crowns its gate, and at night the star-readers climb to its terrace to watch the Moon."
 jip_temple_of_sin_enabled_trigger:0 "The holder is a Sabian or follows the old gods"
 jip_unlock_mesopotamian_conversion_tt:0 "The old gods are honoured again at Harran: characters may now convert to $mesopotamian_pagan$"

 # The temple completed (events/jip_sabian_events.txt)
 jip_sabian.0001.t:0 "The House of Rejoicing"
 jip_sabian.0001.desc:0 "The scaffolding has come down, and the Ehulhul stands again on its old foundations. The priests carry the silver crescent through the gate, and at nightfall the whole city climbs onto the roofs to watch the Moon rise over the temple.\n\nFor centuries the Sabians kept the Moon's rites in secret, calling themselves by a name the Qur'an protects. Now the temple is built. Your priests ask whether the old gods may be called by their own names again."
 jip_sabian.0001.a:0 "Let the old gods be proclaimed."
 jip_sabian.0001.b:0 "We remain Sabians. The temple serves the Moon all the same."
 jip_sabian.0001.c:0 "The Lord of the Moon has his house again."
 jip_sabian.0001.d:0 "Open the doors. Let the mysteries be unveiled."

 ### The temples of the old gods and the Nineveh dig (0.15 plan, section 5)
 jip_gp_temple_held_tt:0 "The site is in your realm"
 jip_gp_temple_mosul_tt:0 "You hold the county of [GetTitleByKey('c_mosul').GetName], or your vassal does"
 jip_temple_of_the_old_gods_enabled_trigger:0 "The holder is a Sabian or follows the old gods"
 jip_temple_of_ashur_enabled_trigger:0 "The holder follows $mesopotamian_pagan$"
 jip_gp_temple_of_ashur_faithful_tt:0 "The contributor follows $mesopotamian_pagan$"

 # The Temple of Bel at Palmyra
 great_project_type_jip_gp_temple_of_bel:0 "Raise the House of Bel"
 great_project_type_jip_gp_temple_of_bel_possessive:0 "the House of Bel's"
 great_project_type_jip_gp_temple_of_bel_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_bel$"
 great_project_type_tooltip_jip_gp_temple_of_bel:0 "Rebuild the temple of Bel at Palmyra, consecrated in the year 32 and paid for by the caravan masters of the desert city. Odaenathus and Zenobia worshipped in its courts; since the Christians closed it, it has stood empty.\n\nThe Sabians honour Bel as the planet Jupiter, and the old faith as one of its gods."
 jip_gp_temple_of_bel_location_tt:0 "Only at [GetTitleByKey('b_tadmur').GetName], where the temple of Bel stood"
 jip_gp_temple_of_bel_palmyra_tt:0 "You hold the county of [GetTitleByKey('c_palmyra').GetName], or your vassal does"
 jip_gp_temple_of_bel_building_tt:0 "The Temple of Bel rises at Palmyra"
 great_project_type_jip_gp_temple_of_bel_contribution_limestone:0 "Golden Limestone"
 great_project_type_jip_gp_temple_of_bel_contribution_limestone_desc:0 "The temple was built of the golden limestone of the hills around Palmyra. The old quarries must be opened again."
 great_project_type_jip_gp_temple_of_bel_contribution_caravans:0 "The Caravan Masters"
 great_project_type_jip_gp_temple_of_bel_contribution_caravans_desc:0 "The merchants of the caravan roads paid for the first temple, and their inscriptions lined its courts. Their heirs are asked to give again."
 great_project_type_jip_gp_temple_of_bel_contribution_priests:0 "The Priests of Bel"
 great_project_type_jip_gp_temple_of_bel_contribution_priests_desc:0 "Priests in white robes and tall hats, to carry the god's image in procession as they did in Zenobia's day."
 great_project_type_jip_gp_temple_of_bel_contribution_eagle:0 "The Eagle of Bel"
 great_project_type_jip_gp_temple_of_bel_contribution_eagle_desc:0 "On the ceiling of the inner shrine, a carved eagle spread its wings among the planets. Carvers must set it there again."
 great_project_type_jip_gp_temple_of_bel_contribution_colonnade:0 "The Great Colonnade"
 great_project_type_jip_gp_temple_of_bel_contribution_colonnade_desc:0 "A double colonnade ran around the temple courtyard, the greatest in the East. It can be raised again, column by column."
 building_type_jip_temple_of_bel_01:0 "Temple of Bel"
 building_type_jip_temple_of_bel_01_desc:0 "The great temple of Bel at Palmyra, the caravan city's god."
 building_jip_temple_of_bel_01:0 "Temple of Bel"
 building_jip_temple_of_bel_01_desc:0 "The house of Bel stands again in the middle of Palmyra. Its stepped merlons catch the sun, the eagle spreads its wings over the inner shrine, and the caravans stop at its gate to give thanks for the crossing."

 # The Temple of Shamash at Hatra
 great_project_type_jip_gp_temple_of_shamash:0 "Raise the Temple of the Sun"
 great_project_type_jip_gp_temple_of_shamash_possessive:0 "the Temple of the Sun's"
 great_project_type_jip_gp_temple_of_shamash_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_shamash$"
 great_project_type_tooltip_jip_gp_temple_of_shamash:0 "Rebuild the great temple of Shamash at Hatra, the round city in the desert that twice turned back the Roman emperors. Its vaulted halls stood empty since the Persians took the city.\n\nShamash is the sun, judge of gods and men; the Sabians count him among the seven planets."
 jip_gp_temple_of_shamash_location_tt:0 "Only at [GetTitleByKey('b_al-hadr').GetName], where the temple of Shamash stood"
 jip_gp_temple_of_shamash_building_tt:0 "The Temple of Shamash rises at Hatra"
 great_project_type_jip_gp_temple_of_shamash_contribution_iwans:0 "The Great Iwans"
 great_project_type_jip_gp_temple_of_shamash_contribution_iwans_desc:0 "The temple's open vaulted halls, the tallest in the land, with faces carved on their keystones."
 great_project_type_jip_gp_temple_of_shamash_contribution_walls:0 "The Round Walls"
 great_project_type_jip_gp_temple_of_shamash_contribution_walls_desc:0 "Trajan and Septimius Severus both broke against the walls of Hatra. A temple of the sun needs them standing."
 great_project_type_jip_gp_temple_of_shamash_contribution_priests:0 "The Priests of Shamash"
 great_project_type_jip_gp_temple_of_shamash_contribution_priests_desc:0 "Priests to greet the sun at dawn and to judge in its name, from the Sabians or the old faith."
 great_project_type_jip_gp_temple_of_shamash_contribution_sun_disc:0 "The Sun Disc"
 great_project_type_jip_gp_temple_of_shamash_contribution_sun_disc_desc:0 "A disc of gold above the central arch, to catch the first light of every day."
 great_project_type_jip_gp_temple_of_shamash_contribution_kings:0 "The Kings of Hatra"
 great_project_type_jip_gp_temple_of_shamash_contribution_kings_desc:0 "Statues of the kings of Hatra, the kings of the Arabs, in the temple courts where their fathers set them."
 building_type_jip_temple_of_shamash_01:0 "Temple of Shamash"
 building_type_jip_temple_of_shamash_01_desc:0 "The great temple of Shamash, the sun, at Hatra."
 building_jip_temple_of_shamash_01:0 "Temple of Shamash"
 building_jip_temple_of_shamash_01_desc:0 "The iwans of Hatra open to the sunrise again. Behind the round walls, the sun's priests sit in judgement, as they did when Rome came and went."

 # The Temple of Ashur at Ashur
 great_project_type_jip_gp_temple_of_ashur:0 "Raise the House of Ashur"
 great_project_type_jip_gp_temple_of_ashur_possessive:0 "the House of Ashur's"
 great_project_type_jip_gp_temple_of_ashur_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_ashur$"
 great_project_type_tooltip_jip_gp_temple_of_ashur:0 "Rebuild the Esharra, the house of the god Ashur, beside his ziggurat on the cliff above the Tigris. The kings of Assyria ruled as his vicegerents; the city was sacked in 614 BC and its god left without a house.\n\nWhoever restores it rules, as they did, in Ashur's name."
 jip_gp_temple_of_ashur_location_tt:0 "Only at [GetTitleByKey('b_ain_al-qayyara').GetName], the city of Ashur"
 jip_gp_temple_of_ashur_building_tt:0 "The Temple of Ashur rises at Ashur"
 great_project_type_jip_gp_temple_of_ashur_contribution_bricks:0 "Baked Bricks"
 great_project_type_jip_gp_temple_of_ashur_contribution_bricks_desc:0 "Kilns along the river must fire bricks for the ziggurat's stages and the temple walls, each stamped with the builder's name, as the Assyrian kings did."
 great_project_type_jip_gp_temple_of_ashur_contribution_foundation:0 "The Foundation Deposits"
 great_project_type_jip_gp_temple_of_ashur_contribution_foundation_desc:0 "The kings who built before buried their names in the foundations. A scholar must find and read them, so that the god's house rises on its true ground."
 great_project_type_jip_gp_temple_of_ashur_contribution_priests:0 "The Priests of Ashur"
 great_project_type_jip_gp_temple_of_ashur_contribution_priests_desc:0 "Priests of the old faith, to keep the god's house and crown the king in his name."
 great_project_type_jip_gp_temple_of_ashur_contribution_glazed_bricks:0 "Glazed Bricks"
 great_project_type_jip_gp_temple_of_ashur_contribution_glazed_bricks_desc:0 "Bands of blue and yellow glazed brick around the gate, and the winged disc of Ashur above it."
 great_project_type_jip_gp_temple_of_ashur_contribution_lamassu:0 "The Lamassu"
 great_project_type_jip_gp_temple_of_ashur_contribution_lamassu_desc:0 "Winged bulls with the faces of men, to guard the god's gate as they guarded the palaces of the kings."
 building_type_jip_temple_of_ashur_01:0 "Temple of Ashur"
 building_type_jip_temple_of_ashur_01_desc:0 "The Esharra, the house of the god Ashur, beside his ziggurat at Ashur."
 building_jip_temple_of_ashur_01:0 "Temple of Ashur"
 building_jip_temple_of_ashur_01_desc:0 "The ziggurat of Ashur rises over the Tigris again, and the god has his house. Lamassu guard the gate, and the king who built it rules as Ashur's vicegerent."

 # The Temple of Ishtar at Arbela
 great_project_type_jip_gp_temple_of_ishtar:0 "Raise the House of the Lady of Arbela"
 great_project_type_jip_gp_temple_of_ishtar_possessive:0 "the House of the Lady of Arbela's"
 great_project_type_jip_gp_temple_of_ishtar_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_ishtar$"
 great_project_type_tooltip_jip_gp_temple_of_ishtar:0 "Rebuild the Egashankalamma, the temple of Ishtar of Arbela, goddess of war. Her prophetesses spoke her words to the kings of Assyria before every campaign, and Esarhaddon and Ashurbanipal roofed and gilded her house.\n\nThe Sabians honour her as the planet Venus, and the old faith as the Lady of Arbela."
 jip_gp_temple_of_ishtar_location_tt:0 "Only at [GetTitleByKey('b_irbil').GetName], where the Egashankalamma stood"
 jip_gp_temple_of_ishtar_arbela_tt:0 "You hold the county of [GetTitleByKey('c_irbil').GetName], or your vassal does"
 jip_gp_temple_of_ishtar_building_tt:0 "The Temple of Ishtar rises at Arbela"
 great_project_type_jip_gp_temple_of_ishtar_contribution_cedars:0 "Cedars for the Roof"
 great_project_type_jip_gp_temple_of_ishtar_contribution_cedars_desc:0 "Esarhaddon roofed the Egashankalamma with cedar from the mountains, and its restorer must do the same."
 great_project_type_jip_gp_temple_of_ishtar_contribution_gold_plating:0 "Gold for the Shrine"
 great_project_type_jip_gp_temple_of_ishtar_contribution_gold_plating_desc:0 "Ashurbanipal plated the goddess's shrine with gold until it shone like the day. Her house should shine again."
 great_project_type_jip_gp_temple_of_ishtar_contribution_prophetesses:0 "The Prophetesses of Ishtar"
 great_project_type_jip_gp_temple_of_ishtar_contribution_prophetesses_desc:0 "Women who speak with the goddess's voice, as the prophetesses of Arbela spoke to Esarhaddon: ‘Fear not, I am the Lady of Arbela.’"
 great_project_type_jip_gp_temple_of_ishtar_contribution_lion_throne:0 "The Lion Throne"
 great_project_type_jip_gp_temple_of_ishtar_contribution_lion_throne_desc:0 "The goddess's image seated on her throne on the backs of lions, as the seals of Assyria show her."
 great_project_type_jip_gp_temple_of_ishtar_contribution_milqia:0 "The House of Milqia"
 great_project_type_jip_gp_temple_of_ishtar_contribution_milqia_desc:0 "The festival house in the open country outside Arbela, where the goddess rested on her processions and her kings were feasted."
 building_type_jip_temple_of_ishtar_01:0 "Temple of Ishtar"
 building_type_jip_temple_of_ishtar_01_desc:0 "The Egashankalamma, temple of Ishtar of Arbela, the goddess of war."
 building_jip_temple_of_ishtar_01:0 "Temple of Ishtar"
 building_jip_temple_of_ishtar_01_desc:0 "The Lady of Arbela has her house again. Her shrine shines with gold, her image sits on its lion throne, and before every war her prophetesses come to the ruler with her words."

 # The Nineveh dig
 great_project_type_jip_gp_nineveh_excavation:0 "Dig into the Mound of Nineveh"
 great_project_type_jip_gp_nineveh_excavation_possessive:0 "the Nineveh dig's"
 great_project_type_jip_gp_nineveh_excavation_desc:0 "$great_project_type_tooltip_jip_gp_nineveh_excavation$"
 great_project_type_tooltip_jip_gp_nineveh_excavation:0 "Across the Tigris from Mosul lies the mound of Nineveh, the city of the Assyrian kings. Under it, the story goes, lies the library of Ashurbanipal: thousands of clay tablets in the old wedge-writing.\n\nEach dig turns up another of its tablets. The mound must rest #V [EmptyScope.ScriptValue('jip_nineveh_rest_years_value')|0]#! years between digs, and holds #V [EmptyScope.ScriptValue('jip_nineveh_tablets_value')|0]#! tablets in all. Their full power is for the heirs of Assyria: Arameans, Nabati and Assyrians, and the followers of the old gods."
 jip_gp_nineveh_excavation_location_tt:0 "Only at [GetTitleByKey('b_ninawa').GetName], the mound of Nineveh"
 jip_gp_nineveh_excavation_nineveh_tt:0 "You hold the county of [GetTitleByKey('c_ninive').GetName], or your vassal does"
 jip_gp_nineveh_excavation_resting_tt:0 "The mound has rested since the last dig"
 jip_gp_nineveh_excavation_exhausted_tt:0 "Tablets of Ashurbanipal's library are still to be found"
 jip_gp_nineveh_excavation_tablet_tt:0 "A tablet of Ashurbanipal's library comes to light"
 great_project_type_jip_gp_nineveh_excavation_contribution_diggers:0 "Diggers and Baskets"
 great_project_type_jip_gp_nineveh_excavation_contribution_diggers_desc:0 "Diggers from the villages around Mosul, baskets to carry the earth, and timber to prop the galleries."
 great_project_type_jip_gp_nineveh_excavation_contribution_reader:0 "A Reader of the Old Writing"
 great_project_type_jip_gp_nineveh_excavation_contribution_reader_desc:0 "Only a scholar can tell a tablet from a broken brick, and only a learned one can read it."
 great_project_type_jip_gp_nineveh_excavation_contribution_lamps:0 "Lamps for the Galleries"
 great_project_type_jip_gp_nineveh_excavation_contribution_lamps_desc:0 "Oil and lamps, so the diggers can follow the library's rooms deep into the mound."
 great_project_type_jip_gp_nineveh_excavation_contribution_copyists:0 "Copyists"
 great_project_type_jip_gp_nineveh_excavation_contribution_copyists_desc:0 "Copyists to copy what is found onto parchment before the clay crumbles in the open air."

 # The tablets (jip_nineveh_tablet_effect; full modifiers only for the heirs of Assyria, jip_nineveh_tablet_template)
 jip_heir_of_assyria_tt:0 "Is Aramean, Nabati or Assyrian, or follows the old gods"
 jip_artifact_nineveh_gilgamesh_name:0 "The Tablets of Gilgamesh"
 jip_artifact_nineveh_gilgamesh_desc:0 "Twelve clay tablets telling of Gilgamesh, king of Uruk, who sought the plant of life after the death of his friend Enkidu, and of the flood that Utnapishtim survived."
 jip_artifact_nineveh_enuma_elish_name:0 "The Tablets of Creation"
 jip_artifact_nineveh_enuma_elish_desc:0 "‘When on high the heaven had not been named’: the Enuma Elish, telling how the god slew Tiamat and made the world from her body."
 jip_artifact_nineveh_enuma_anu_enlil_name:0 "The Omens of Heaven"
 jip_artifact_nineveh_enuma_anu_enlil_desc:0 "Enuma Anu Enlil, the great series of the omens of the Moon, the Sun and the planets, which the star-readers of Assyria consulted for their kings."
 jip_artifact_nineveh_sakikku_name:0 "The Physicians' Tablets"
 jip_artifact_nineveh_sakikku_desc:0 "Sakikku, the handbook of the Assyrian physicians: the signs of every sickness, from head to foot, and what they foretell."
 jip_artifact_nineveh_catalogue_name:0 "The Catalogue of Ashurbanipal"
 jip_artifact_nineveh_catalogue_desc:0 "The king's own order to his scribes to seek out every tablet in the land for his library, and the lists of what they found."

 # The Esagila, the temple of Marduk at Babylon
 great_project_type_jip_gp_temple_of_marduk:0 "Raise the Esagila"
 great_project_type_jip_gp_temple_of_marduk_possessive:0 "the Esagila's"
 great_project_type_jip_gp_temple_of_marduk_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_marduk$"
 great_project_type_tooltip_jip_gp_temple_of_marduk:0 "Rebuild the Esagila, \"the house whose top is lofty\", the temple of Marduk at Babylon, where the kings of Babylon took the god's hands at every New Year. Alexander meant to restore it and died first; it was still served when the Parthians ruled, and then the city emptied around it.\n\nThe Sabians honour Marduk's star as Jupiter, and the old faith as the king of the gods."
 jip_gp_temple_of_marduk_location_tt:0 "Only at [GetTitleByKey('b_al-hila').GetName], beside the ruins of Babylon"
 jip_gp_temple_of_marduk_babylon_tt:0 "You hold the county of [GetTitleByKey('c_kufa').GetName], or your vassal does"
 jip_gp_temple_of_marduk_building_tt:0 "The Esagila rises at Babylon"
 great_project_type_jip_gp_temple_of_marduk_contribution_bricks:0 "Baked Bricks"
 great_project_type_jip_gp_temple_of_marduk_contribution_bricks_desc:0 "Babylon was built of baked brick laid in bitumen, every brick stamped with the name of the king who made it. The kilns by the Euphrates must burn again."
 great_project_type_jip_gp_temple_of_marduk_contribution_cedar:0 "Cedar of Lebanon"
 great_project_type_jip_gp_temple_of_marduk_contribution_cedar_desc:0 "The god's chamber was roofed with cedar from the mountains of Lebanon and plated with gold. The beams must be cut and floated down the river."
 great_project_type_jip_gp_temple_of_marduk_contribution_priests:0 "The Priests of Marduk"
 great_project_type_jip_gp_temple_of_marduk_contribution_priests_desc:0 "Priests to clothe and feed the god, to recite the Enuma Elish at the New Year and to strike the king's cheek before he takes the god's hands, from the Sabians or the old faith."
 great_project_type_jip_gp_temple_of_marduk_contribution_dragons:0 "The Dragons of Marduk"
 great_project_type_jip_gp_temple_of_marduk_contribution_dragons_desc:0 "The mushhushshu, Marduk's serpent-dragon, walked in glazed blue brick along the Processional Way and the city's great gate. Let them walk there again."
 great_project_type_jip_gp_temple_of_marduk_contribution_ziggurat:0 "Etemenanki"
 great_project_type_jip_gp_temple_of_marduk_contribution_ziggurat_desc:0 "Beside the Esagila stood Etemenanki, \"the house of the foundation of heaven and earth\", the temple tower that the Jews remembered as the Tower of Babel. Raise it again, terrace by terrace."
 building_type_jip_temple_of_marduk_01:0 "Esagila"
 building_type_jip_temple_of_marduk_01_desc:0 "The temple of Marduk, king of the gods, at Babylon. Its New Year festival made and unmade kings."
 building_jip_temple_of_marduk_01:0 "Esagila"
 building_jip_temple_of_marduk_01_desc:0 "The house of Marduk stands again at Babylon, and the god waits in it for the New Year."

 # The Canaanite temples
 jip_gp_canaanite_faithful_tt:0 "The contributor follows Canaanism"
 jip_temple_of_canaan_enabled_trigger:0 "The holder follows Canaanism"

 # The Temple of Melqart at Tyre
 great_project_type_jip_gp_temple_of_melqart:0 "Raise the House of Melqart"
 great_project_type_jip_gp_temple_of_melqart_possessive:0 "the House of Melqart's"
 great_project_type_jip_gp_temple_of_melqart_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_melqart$"
 great_project_type_tooltip_jip_gp_temple_of_melqart:0 "Rebuild the temple of Melqart, \"King of the City\", at Tyre. Its priests told Herodotus it had stood for two thousand three hundred years; Carthage sent it a tenth of its wealth every year, and Alexander besieged Tyre for seven months when the Tyrians would not let him sacrifice in it.\n\nMelqart, whom the Greeks called Heracles, died each winter on a pyre and was woken each spring; while his house stood, so did Tyre."
 jip_gp_temple_of_melqart_location_tt:0 "Only at [GetTitleByKey('b_tyre').GetName], where Melqart's temple stood"
 jip_gp_temple_of_melqart_city_tt:0 "You hold the county of [GetTitleByKey('c_acre').GetName], or your vassal does"
 jip_gp_temple_of_melqart_building_tt:0 "The Temple of Melqart rises at Tyre"
 great_project_type_jip_gp_temple_of_melqart_contribution_cedar:0 "Cedar of Lebanon"
 great_project_type_jip_gp_temple_of_melqart_contribution_cedar_desc:0 "Hiram of Tyre roofed Melqart's house with cedar and sent the same timber to Solomon for his temple. The mountains still bear it."
 great_project_type_jip_gp_temple_of_melqart_contribution_purple:0 "Tyrian Purple"
 great_project_type_jip_gp_temple_of_melqart_contribution_purple_desc:0 "The dye that made Tyre rich comes from the murex of its shore. Let the dyers pay for the god's hangings, as their fathers did."
 great_project_type_jip_gp_temple_of_melqart_contribution_priests:0 "The Priests of Melqart"
 great_project_type_jip_gp_temple_of_melqart_contribution_priests_desc:0 "Shaven priests in linen, barefoot before the altar, to keep the god's undying fire and to wake him in the spring, from the followers of Canaanism."
 great_project_type_jip_gp_temple_of_melqart_contribution_pillars:0 "The Two Pillars"
 great_project_type_jip_gp_temple_of_melqart_contribution_pillars_desc:0 "Herodotus saw two pillars in the temple, one of refined gold and one of emerald that shone at night. Set them at the door again."
 great_project_type_jip_gp_temple_of_melqart_contribution_altar:0 "The Altar of the Awakening"
 great_project_type_jip_gp_temple_of_melqart_contribution_altar_desc:0 "Each spring the king of Tyre burned the god's image on a great pyre, and the priests called him back to life: the egersis, the Awakening of Melqart. Build the altar where he rises."
 building_type_jip_temple_of_melqart_01:0 "Temple of Melqart"
 building_type_jip_temple_of_melqart_01_desc:0 "The house of Melqart, King of the City, the god of Tyre and of its ships."
 building_jip_temple_of_melqart_01:0 "Temple of Melqart"
 building_jip_temple_of_melqart_01_desc:0 "Melqart's house stands again at Tyre: cedar under the roof, purple at the doors, and the two pillars shining in the dark for the ships coming in."

 # The Temple of Tanit and Baal Hammon at Carthage
 great_project_type_jip_gp_temple_of_tanit:0 "Raise the House of Tanit"
 great_project_type_jip_gp_temple_of_tanit_possessive:0 "the House of Tanit's"
 great_project_type_jip_gp_temple_of_tanit_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_tanit$"
 great_project_type_tooltip_jip_gp_temple_of_tanit:0 "Rebuild the sanctuary of Tanit, the Lady of Carthage, where for six hundred years the Carthaginians set up stones carved with her sign. Rome burned the city in 146 BCE and ploughed it under; Tanit lived on as the Heavenly Goddess, until the Christians closed her temple too.\n\nQart-hadasht means the New City. Let it be new again."
 jip_gp_temple_of_tanit_location_tt:0 "Only at [GetTitleByKey('b_tunis').GetName], beside the ruins of Carthage"
 jip_gp_temple_of_tanit_city_tt:0 "You hold the county of [GetTitleByKey('c_tunis').GetName], or your vassal does"
 jip_gp_temple_of_tanit_building_tt:0 "The Temple of Tanit rises at Carthage"
 great_project_type_jip_gp_temple_of_tanit_contribution_sandstone:0 "Stone of El Haouaria"
 great_project_type_jip_gp_temple_of_tanit_contribution_sandstone_desc:0 "Carthage was built of the golden sandstone of El Haouaria, quarried on Cape Bon and shipped across the gulf. The caves the quarrymen cut are still there."
 great_project_type_jip_gp_temple_of_tanit_contribution_tyrians:0 "Craftsmen of Tyre"
 great_project_type_jip_gp_temple_of_tanit_contribution_tyrians_desc:0 "Carthage was Tyre's daughter, and sent its mother city a tenth of its wealth every year. Let Tyre's masons and bronze-casters repay the debt."
 great_project_type_jip_gp_temple_of_tanit_contribution_priests:0 "The Priests of Tanit"
 great_project_type_jip_gp_temple_of_tanit_contribution_priests_desc:0 "Priests and priestesses to serve the Lady of Carthage, to keep her feasts and to hear the city's vows, from the followers of Canaanism."
 great_project_type_jip_gp_temple_of_tanit_contribution_stelae:0 "The Field of Stelae"
 great_project_type_jip_gp_temple_of_tanit_contribution_stelae_desc:0 "Thousands of stones stood in the sanctuary, each carved with the sign of Tanit and a vow kept. Let the stonecutters carve new ones for new vows."
 great_project_type_jip_gp_temple_of_tanit_contribution_steps:0 "The Sixty Steps"
 great_project_type_jip_gp_temple_of_tanit_contribution_steps_desc:0 "Sixty steps climbed the Byrsa, Carthage's hill, to the gilded temple at its top, the city's last refuge in the Roman siege. Cut them again."
 building_type_jip_temple_of_tanit_01:0 "Temple of Tanit"
 building_type_jip_temple_of_tanit_01_desc:0 "The sanctuary of Tanit, the Lady of Carthage."
 building_jip_temple_of_tanit_01:0 "Temple of Tanit"
 building_jip_temple_of_tanit_01_desc:0 "Tanit's sign is carved over the door of Carthage again, and the stones of new vows stand in her field."

 # The Temple of Eshmun at Sidon
 great_project_type_jip_gp_temple_of_eshmun:0 "Raise the House of Eshmun"
 great_project_type_jip_gp_temple_of_eshmun_possessive:0 "the House of Eshmun's"
 great_project_type_jip_gp_temple_of_eshmun_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_eshmun$"
 great_project_type_tooltip_jip_gp_temple_of_eshmun:0 "Rebuild the temple of Eshmun, the god who heals, outside Sidon, where the sick of the whole coast came to bathe in his pools and sleep in his court. Kings of Sidon built it and rebuilt it for three hundred years; the Greeks knew Eshmun as Asclepius.\n\nThe ruins lie in the orchards by the river, and the spring still runs."
 jip_gp_temple_of_eshmun_location_tt:0 "Only at [GetTitleByKey('b_saida').GetName], where Eshmun's temple stood"
 jip_gp_temple_of_eshmun_city_tt:0 "You hold the county of [GetTitleByKey('c_beirut').GetName], or your vassal does"
 jip_gp_temple_of_eshmun_building_tt:0 "The Temple of Eshmun rises at Sidon"
 great_project_type_jip_gp_temple_of_eshmun_contribution_podium:0 "The Podium"
 great_project_type_jip_gp_temple_of_eshmun_contribution_podium_desc:0 "Eshmun's temple stood on a terrace of huge limestone blocks above the river, raised by the kings of Sidon and raised again by each of their heirs. Lay its courses once more."
 great_project_type_jip_gp_temple_of_eshmun_contribution_spring:0 "The Ydlal Spring"
 great_project_type_jip_gp_temple_of_eshmun_contribution_spring_desc:0 "The sick came to bathe in the god's pools, fed by a channel from the spring of Ydlal. Dig the channel and fill the pools again."
 great_project_type_jip_gp_temple_of_eshmun_contribution_priests:0 "The Priests of Eshmun"
 great_project_type_jip_gp_temple_of_eshmun_contribution_priests_desc:0 "Priests and healers to keep the god's pools, to read the dreams of the sick who sleep in his court, and to take their thanks, from the followers of Canaanism."
 great_project_type_jip_gp_temple_of_eshmun_contribution_throne:0 "The Empty Throne"
 great_project_type_jip_gp_temple_of_eshmun_contribution_throne_desc:0 "In the sacred pool stood an empty throne flanked by winged sphinxes, kept for the god. Carve it again."
 great_project_type_jip_gp_temple_of_eshmun_contribution_tribune:0 "The Tribune of Eshmun"
 great_project_type_jip_gp_temple_of_eshmun_contribution_tribune_desc:0 "A marble tribune carved with the god's festival, musicians above and dancers below, stood in the court. Let the carvers set it there again."
 building_type_jip_temple_of_eshmun_01:0 "Temple of Eshmun"
 building_type_jip_temple_of_eshmun_01_desc:0 "The temple of Eshmun, the healing god of Sidon, with its sacred pools."
 building_jip_temple_of_eshmun_01:0 "Temple of Eshmun"
 building_jip_temple_of_eshmun_01_desc:0 "Eshmun's pools are full again outside Sidon, and the sick sleep in his court waiting for his dreams."

 # The Temple of Baalat Gebal at Byblos
 great_project_type_jip_gp_temple_of_baalat_gebal:0 "Raise the House of the Lady"
 great_project_type_jip_gp_temple_of_baalat_gebal_possessive:0 "the House of the Lady's"
 great_project_type_jip_gp_temple_of_baalat_gebal_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_baalat_gebal$"
 great_project_type_tooltip_jip_gp_temple_of_baalat_gebal:0 "Rebuild the temple of Baalat Gebal, the Lady of Byblos, the oldest goddess of the Phoenician coast, who gave the kings of Gebal their thrones. Egypt's pharaohs sent her gifts for two thousand years, and the Greeks named the book after her city.\n\nHer temple was old when Tyre was young. Let it stand again."
 jip_gp_temple_of_baalat_gebal_location_tt:0 "Only at [GetTitleByKey('b_syrtripolis').GetName], the old Gebal"
 jip_gp_temple_of_baalat_gebal_city_tt:0 "You hold the county of [GetTitleByKey('c_tripoli').GetName], or your vassal does"
 jip_gp_temple_of_baalat_gebal_building_tt:0 "The Temple of Baalat Gebal rises at Byblos"
 great_project_type_jip_gp_temple_of_baalat_gebal_contribution_foundations:0 "The Old Foundations"
 great_project_type_jip_gp_temple_of_baalat_gebal_contribution_foundations_desc:0 "The Lady's temple was older than the pyramids, and the pharaohs sent gifts to it with their names cut on them. Clear the old foundations and build on them."
 great_project_type_jip_gp_temple_of_baalat_gebal_contribution_papyrus:0 "Papyrus of Egypt"
 great_project_type_jip_gp_temple_of_baalat_gebal_contribution_papyrus_desc:0 "Byblos sold Lebanon's cedar to Egypt for papyrus, and the Greeks named their books after the city that sold it to them. Let the trade pay for the temple again."
 great_project_type_jip_gp_temple_of_baalat_gebal_contribution_priests:0 "The Priestesses of the Lady"
 great_project_type_jip_gp_temple_of_baalat_gebal_contribution_priests_desc:0 "Priestesses to serve the Lady of Byblos, who gave the kings of Gebal their thrones, and to keep her feasts, from the followers of Canaanism."
 great_project_type_jip_gp_temple_of_baalat_gebal_contribution_obelisks:0 "The Field of Obelisks"
 great_project_type_jip_gp_temple_of_baalat_gebal_contribution_obelisks_desc:0 "Beside the Lady's temple stood a field of obelisks, set up by those who had made vows. Raise new ones for new vows."
 great_project_type_jip_gp_temple_of_baalat_gebal_contribution_gardens:0 "The Lady's Gardens"
 great_project_type_jip_gp_temple_of_baalat_gebal_contribution_gardens_desc:0 "Every spring the women of Byblos planted little gardens for the Lady that flowered and withered in days, and wept over them as the river ran red from the mountains. Plant them again."
 building_type_jip_temple_of_baalat_gebal_01:0 "Temple of Baalat Gebal"
 building_type_jip_temple_of_baalat_gebal_01_desc:0 "The temple of the Lady of Byblos, the oldest goddess of the Phoenician coast."
 building_jip_temple_of_baalat_gebal_01:0 "Temple of Baalat Gebal"
 building_jip_temple_of_baalat_gebal_01_desc:0 "The Lady of Byblos has her house again, with new obelisks of vows beside it and the old foundations under it."

 # The Temple of Baal at Baalbek
 great_project_type_jip_gp_temple_of_baal:0 "Raise the House of Baal"
 great_project_type_jip_gp_temple_of_baal_possessive:0 "the House of Baal's"
 great_project_type_jip_gp_temple_of_baal_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_baal$"
 great_project_type_tooltip_jip_gp_temple_of_baal:0 "Rebuild the great temple of Baal at Baalbek, which the Greeks called Heliopolis, the City of the Sun: the greatest temple Rome ever raised, set on a platform whose stones are the largest men have ever moved. The Christians turned it into a church and the Arabs into a fortress.\n\nBaal's own city has waited for him the longest."
 jip_gp_temple_of_baal_location_tt:0 "Only at [GetTitleByKey('b_baalbak').GetName], on the old temple platform"
 jip_gp_temple_of_baal_city_tt:0 "You hold the county of [GetTitleByKey('c_baalbek').GetName], or your vassal does"
 jip_gp_temple_of_baal_building_tt:0 "The Temple of Baal rises at Baalbek"
 great_project_type_jip_gp_temple_of_baal_contribution_trilithon:0 "The Trilithon"
 great_project_type_jip_gp_temple_of_baal_contribution_trilithon_desc:0 "Three stones, each the weight of a hundred and fifty elephants, lie in the temple's podium, and no one knows any more how they were raised. Set the podium right before anything stands on it."
 great_project_type_jip_gp_temple_of_baal_contribution_quarry:0 "The Quarry"
 great_project_type_jip_gp_temple_of_baal_contribution_quarry_desc:0 "In the quarry outside the city lies a stone even greater than the trilithon, cut and never moved. Open the quarry again for the columns and the walls."
 great_project_type_jip_gp_temple_of_baal_contribution_priests:0 "The Priests of Baal"
 great_project_type_jip_gp_temple_of_baal_contribution_priests_desc:0 "Priests to serve Baal of the city, whom the Greeks called the Sun and the Romans Jupiter, and to carry his golden image on his feast, from the followers of Canaanism."
 great_project_type_jip_gp_temple_of_baal_contribution_columns:0 "The Great Columns"
 great_project_type_jip_gp_temple_of_baal_contribution_columns_desc:0 "Fifty-four columns twenty metres high stood around Baal's temple; six still stand. Raise the other forty-eight."
 great_project_type_jip_gp_temple_of_baal_contribution_lesser_temple:0 "The Lesser Temple"
 great_project_type_jip_gp_temple_of_baal_contribution_lesser_temple_desc:0 "Beside Baal's temple stood a smaller one, finer carved than any in the Roman world. Restore it with him."
 building_type_jip_temple_of_baal_01:0 "Temple of Baal"
 building_type_jip_temple_of_baal_01_desc:0 "The great temple of Baal at Baalbek, the City of the Sun."
 building_jip_temple_of_baal_01:0 "Temple of Baal"
 building_jip_temple_of_baal_01_desc:0 "Baal's temple stands again at Baalbek on its giant stones, its columns taller than the walls of most cities."

 # The Temple of Astarte at Kition
 great_project_type_jip_gp_temple_of_astarte:0 "Raise the House of Astarte"
 great_project_type_jip_gp_temple_of_astarte_possessive:0 "the House of Astarte's"
 great_project_type_jip_gp_temple_of_astarte_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_astarte$"
 great_project_type_tooltip_jip_gp_temple_of_astarte:0 "Rebuild the temple of Astarte at Kition, the greatest Phoenician temple on Cyprus, built over an older shrine of the copper-workers. The island that gave copper its name was the goddess's own: the Greeks said she rose from the sea on its shore and called her the Cyprian.\n\nKition's kings ruled in her name until Ptolemy took the island."
 jip_gp_temple_of_astarte_location_tt:0 "Only at [GetTitleByKey('b_nicosia').GetName], the old Kition"
 jip_gp_temple_of_astarte_city_tt:0 "You hold the county of [GetTitleByKey('c_nicosia').GetName], or your vassal does"
 jip_gp_temple_of_astarte_building_tt:0 "The Temple of Astarte rises at Kition"
 great_project_type_jip_gp_temple_of_astarte_contribution_ashlar:0 "The Ashlar Walls"
 great_project_type_jip_gp_temple_of_astarte_contribution_ashlar_desc:0 "The Phoenicians of Kition built Astarte's temple of huge squared stones on top of an older temple of the copper-workers. Set the walls up again."
 great_project_type_jip_gp_temple_of_astarte_contribution_copper:0 "Copper of Cyprus"
 great_project_type_jip_gp_temple_of_astarte_contribution_copper_desc:0 "The copper workshops stood beside the goddess's temple and paid for it; Cyprus gave copper its very name. Let the smelters pay again."
 great_project_type_jip_gp_temple_of_astarte_contribution_priests:0 "The Priestesses of Astarte"
 great_project_type_jip_gp_temple_of_astarte_contribution_priests_desc:0 "Priestesses to serve the Lady of Heaven, to keep her doves and her feasts, from the followers of Canaanism."
 great_project_type_jip_gp_temple_of_astarte_contribution_doves:0 "The Dovecotes"
 great_project_type_jip_gp_temple_of_astarte_contribution_doves_desc:0 "Astarte's doves nested in her temple, and no one on Cyprus might harm them. Build the dovecotes and let them come back."
 great_project_type_jip_gp_temple_of_astarte_contribution_harbour:0 "The Sacred Harbour"
 great_project_type_jip_gp_temple_of_astarte_contribution_harbour_desc:0 "Kition's war fleet lay in sheds by its inner harbour, under the goddess's eye. Dig out the harbour again."
 building_type_jip_temple_of_astarte_01:0 "Temple of Astarte"
 building_type_jip_temple_of_astarte_01_desc:0 "The temple of Astarte at Kition, the greatest Phoenician temple on Cyprus."
 building_jip_temple_of_astarte_01:0 "Temple of Astarte"
 building_jip_temple_of_astarte_01_desc:0 "Astarte's temple stands again at Kition, its doves on the walls and copper smoke rising beside it."
 # Negations of the buildings' custom_description texts, which the game looks up when they fail
