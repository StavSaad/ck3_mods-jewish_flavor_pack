 # The Temple of Hadad
 great_project_type_jip_gp_temple_of_hadad:0 "Raise the House of Hadad"
 great_project_type_jip_gp_temple_of_hadad_possessive:0 "the House of Hadad's"
 great_project_type_jip_gp_temple_of_hadad_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_hadad$"
 great_project_type_tooltip_jip_gp_temple_of_hadad:0 "Rebuild the temple of Hadad at Damascus, the house of the storm god whom the Aramean kings of Damascus called their father. The Greeks called him Zeus and the Romans Jupiter, and his court was the largest in Syria."
 jip_gp_temple_of_hadad_location_tt:0 "Only at [GetTitleByKey('b_damascus').GetName], where Hadad's court stood"
 jip_gp_temple_of_hadad_city_tt:0 "You hold the county of [GetTitleByKey('c_damascus').GetName], or your vassal does"
 jip_gp_temple_of_hadad_building_tt:0 "The Temple of Hadad rises at Damascus"
 great_project_type_jip_gp_temple_of_hadad_contribution_temenos:0 "The Sacred Court"
 great_project_type_jip_gp_temple_of_hadad_contribution_temenos_desc:0 "Hadad's house stood in a walled court three hundred metres long, lined with colonnades and entered through a monumental gate. Raise its walls again."
 great_project_type_jip_gp_temple_of_hadad_contribution_statue:0 "The Lord of the Storm"
 great_project_type_jip_gp_temple_of_hadad_contribution_statue_desc:0 "A bronze Hadad striding on his bull, the triple thunderbolt raised in his hand, as the stelae of the Aramean kings show him. Cast him for the court."
 great_project_type_jip_gp_temple_of_hadad_contribution_priests:0 "The Priests of Hadad"
 great_project_type_jip_gp_temple_of_hadad_contribution_priests_desc:0 "Priests to sacrifice to the Thunderer, to pray for rain in the dry years and to bless the armies of his sons."
 great_project_type_jip_gp_temple_of_hadad_contribution_propylaea:0 "The Great Gateway"
 great_project_type_jip_gp_temple_of_hadad_contribution_propylaea_desc:0 "A triple gateway of carved columns led from the city into Hadad's court. Its stones still stand in the market; let them be raised as a gate again."
 great_project_type_jip_gp_temple_of_hadad_contribution_rain:0 "Hadad's Rain"
 great_project_type_jip_gp_temple_of_hadad_contribution_rain_desc:0 "When the rain comes the people climb to Hadad's house with the first fruits. Pay for the feast, and the god will remember the city in the dry years."
 building_type_jip_temple_of_hadad_01:0 "Temple of Hadad"
 building_type_jip_temple_of_hadad_01_desc:0 "The house of Hadad, the storm god of the kings of Damascus, in its walled court."
 building_jip_temple_of_hadad_01:0 "Temple of Hadad"
 building_jip_temple_of_hadad_01_desc:0 "Hadad strides on his bull again in the great court of Damascus, the thunderbolt in his hand, and the people bring him the first fruits when the rain comes."

 # The Temple of Atargatis
 great_project_type_jip_gp_temple_of_atargatis:0 "Raise the House of the Syrian Goddess"
 great_project_type_jip_gp_temple_of_atargatis_possessive:0 "the House of the Syrian Goddess's"
 great_project_type_jip_gp_temple_of_atargatis_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_atargatis$"
 great_project_type_tooltip_jip_gp_temple_of_atargatis:0 "Rebuild the temple of Atargatis at Manbij, the holy city the Greeks called Hierapolis, where pilgrims came from all Syria and Mesopotamia to the Syrian Goddess and her sacred lake."
 jip_gp_temple_of_atargatis_location_tt:0 "Only at [GetTitleByKey('b_manbij').GetName], where the goddess's temple stood"
 jip_gp_temple_of_atargatis_city_tt:0 "You hold the county of [GetTitleByKey('c_aleppo').GetName], or your vassal does"
 jip_gp_temple_of_atargatis_building_tt:0 "The Temple of Atargatis rises at Manbij"
 great_project_type_jip_gp_temple_of_atargatis_contribution_platform:0 "The Golden Doors"
 great_project_type_jip_gp_temple_of_atargatis_contribution_platform_desc:0 "The goddess's temple stood on a high platform facing the sunrise, with doors of gold and a sanctuary gilded inside. Raise the platform and hang the doors."
 great_project_type_jip_gp_temple_of_atargatis_contribution_lake:0 "The Sacred Lake"
 great_project_type_jip_gp_temple_of_atargatis_contribution_lake_desc:0 "Beside the temple lay a lake of the goddess, deep and clear, with an altar of stone in its middle and fish that no one may eat. Dig it again and bring back her fish."
 great_project_type_jip_gp_temple_of_atargatis_contribution_galli:0 "The Galli"
 great_project_type_jip_gp_temple_of_atargatis_contribution_galli_desc:0 "Her priests in their long saffron robes, who carry her image through the cities and lead the pilgrims in her festivals."
 great_project_type_jip_gp_temple_of_atargatis_contribution_images:0 "The Two Images"
 great_project_type_jip_gp_temple_of_atargatis_contribution_images_desc:0 "In the sanctuary sat the goddess on her lions and Hadad on his bulls, and between them a golden standard that went twice a year down to the sea. Make them again."
 great_project_type_jip_gp_temple_of_atargatis_contribution_pyre:0 "The Court of the Pyre"
 great_project_type_jip_gp_temple_of_atargatis_contribution_pyre_desc:0 "Every spring the pilgrims set great trees up in the temple court, hang them with offerings and burn them. Pave a court wide enough for the whole of Syria."
 building_type_jip_temple_of_atargatis_01:0 "Temple of Atargatis"
 building_type_jip_temple_of_atargatis_01_desc:0 "The temple of the Syrian Goddess at Manbij, with its sacred lake."
 building_jip_temple_of_atargatis_01:0 "Temple of Atargatis"
 building_jip_temple_of_atargatis_01_desc:0 "The golden doors of the Syrian Goddess open to the sunrise again at Manbij, her fish swim in the sacred lake, and the pilgrims come every spring to burn the Pyre."

 # The Temple of Elagabal
 great_project_type_jip_gp_temple_of_elagabal:0 "Raise the House of the Sun"
 great_project_type_jip_gp_temple_of_elagabal_possessive:0 "the House of the Sun's"
 great_project_type_jip_gp_temple_of_elagabal_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_elagabal$"
 great_project_type_tooltip_jip_gp_temple_of_elagabal:0 "Rebuild the temple of Elagabal at Emesa, the sun god of the black stone, whose priest-kings ruled the city and whose priest became emperor of Rome."
 jip_gp_temple_of_elagabal_location_tt:0 "Only at [GetTitleByKey('b_hims').GetName], where the sun god's temple stood"
 jip_gp_temple_of_elagabal_city_tt:0 "You hold the county of [GetTitleByKey('c_homs').GetName], or your vassal does"
 jip_gp_temple_of_elagabal_building_tt:0 "The Temple of Elagabal rises at Emesa"
 great_project_type_jip_gp_temple_of_elagabal_contribution_podium:0 "The High Podium"
 great_project_type_jip_gp_temple_of_elagabal_contribution_podium_desc:0 "The coins of Emesa show the sun god's temple raised on a high podium, reached by a great stair. Build it so the stone stands above the city."
 great_project_type_jip_gp_temple_of_elagabal_contribution_stone:0 "The Black Stone"
 great_project_type_jip_gp_temple_of_elagabal_contribution_stone_desc:0 "The god is no statue but a tall black stone fallen from the sky, rounded below and pointed above. Find it, or one the priests will swear to, and set it on its pedestal."
 great_project_type_jip_gp_temple_of_elagabal_contribution_priests:0 "The Priests of the Sun"
 great_project_type_jip_gp_temple_of_elagabal_contribution_priests_desc:0 "The priests of Elagabal in their purple robes, who danced before the stone to pipes and cymbals; from their family came the priest-kings of Emesa."
 great_project_type_jip_gp_temple_of_elagabal_contribution_eagle:0 "The Golden Eagle"
 great_project_type_jip_gp_temple_of_elagabal_contribution_eagle_desc:0 "Before the stone stood an eagle of gold with its wings spread, the bird of the sun. Let the goldsmiths make it."
 great_project_type_jip_gp_temple_of_elagabal_contribution_procession:0 "The Sun's Chariot"
 great_project_type_jip_gp_temple_of_elagabal_contribution_procession_desc:0 "Once a year the stone rode through the city in a chariot drawn by six white horses, the priest walking backwards before it. Build the chariot and breed the horses."
 building_type_jip_temple_of_elagabal_01:0 "Temple of Elagabal"
 building_type_jip_temple_of_elagabal_01_desc:0 "The temple of the sun god of Emesa and his black stone."
 building_jip_temple_of_elagabal_01:0 "Temple of Elagabal"
 building_jip_temple_of_elagabal_01_desc:0 "The black stone of Elagabal stands again on its high podium at Emesa, the golden eagle before it, and the priests dance before it in the sun."

 # The Temple of Gad
 great_project_type_jip_gp_temple_of_gad:0 "Raise the House of Gad"
 great_project_type_jip_gp_temple_of_gad_possessive:0 "the House of Gad's"
 great_project_type_jip_gp_temple_of_gad_desc:0 "$great_project_type_tooltip_jip_gp_temple_of_gad$"
 great_project_type_tooltip_jip_gp_temple_of_gad:0 "Rebuild the temple of Gad at Dura-Europos, below Rahba on the Euphrates, where the merchants of the caravan roads honoured the Fortunes of Dura and Palmyra."
 jip_gp_temple_of_gad_location_tt:0 "Only at [GetTitleByKey('b_al-rahba').GetName], near where Dura stood"
 jip_gp_temple_of_gad_city_tt:0 "You hold the county of [GetTitleByKey('c_rahba').GetName], or your vassal does"
 jip_gp_temple_of_gad_building_tt:0 "The Temple of Gad rises at Dura"
 great_project_type_jip_gp_temple_of_gad_contribution_court:0 "The Courtyard"
 great_project_type_jip_gp_temple_of_gad_contribution_court_desc:0 "Gad's house at Dura was a courtyard of plastered brick with rooms along its sides and a raised sanctuary at its back. Build it on the cliff above the river."
 great_project_type_jip_gp_temple_of_gad_contribution_reliefs:0 "The Two Fortunes"
 great_project_type_jip_gp_temple_of_gad_contribution_reliefs_desc:0 "In the sanctuary stood two reliefs: the Gad of Dura enthroned between eagles, crowned by the city's founder, and the Gad of Palmyra with her crown of walls. Carve them again."
 great_project_type_jip_gp_temple_of_gad_contribution_priests:0 "The Priests of Gad"
 great_project_type_jip_gp_temple_of_gad_contribution_priests_desc:0 "Priests to keep the god's lamps and take the merchants' offerings before they set out on the desert roads."
 great_project_type_jip_gp_temple_of_gad_contribution_caravans:0 "The Caravan Masters"
 great_project_type_jip_gp_temple_of_gad_contribution_caravans_desc:0 "The merchants of Palmyra who lived at Dura paid for its temples, and their names were carved on the altars. Let them pay again, and let their caravans come back."
 great_project_type_jip_gp_temple_of_gad_contribution_altar:0 "The Altar of Offerings"
 great_project_type_jip_gp_temple_of_gad_contribution_altar_desc:0 "Before the sanctuary stood an altar where the faithful burned incense and laid their coins for luck. Set it up, and let the god take his share."
 building_type_jip_temple_of_gad_01:0 "Temple of Gad"
 building_type_jip_temple_of_gad_01_desc:0 "The temple of Gad, the Fortune of the city, on the Euphrates."
 building_jip_temple_of_gad_01:0 "Temple of Gad"
 building_jip_temple_of_gad_01_desc:0 "Gad's lamps burn again above the Euphrates, where the Fortunes of Dura and Palmyra sit side by side, and the caravan masters leave their coins at his altar before the desert road."
