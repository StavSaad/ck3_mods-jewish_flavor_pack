l_english:
 ### The Third Temple's great projects (common/great_projects/types/jip_third_temple_projects.txt)
 great_project_type_jip_gp_clear_the_temple_mount:0 "Clear the Temple Mount"
 great_project_type_jip_gp_clear_the_temple_mount_possessive:0 "the Temple Mount's"
 great_project_type_jip_gp_clear_the_temple_mount_desc:0 "$great_project_type_tooltip_jip_gp_clear_the_temple_mount$"
 great_project_type_tooltip_jip_gp_clear_the_temple_mount:0 "Take down the Dome of the Rock, which has stood over the ruins of the Temple since the days of the Umayyads, and make the Mount ready to build on.\n\nNo act will anger the Muslim world more. While the work lasts every Muslim ruler will resent you, and when it is done they will not forgive it: Jerusalem ceases to be a holy site of Islam, and its faiths lose [fervor|E]."
 great_project_type_jip_gp_clear_the_temple_mount_contribution_labourers:0 "Masons and Labourers"
 great_project_type_jip_gp_clear_the_temple_mount_contribution_labourers_desc:0 "The dome must come down stone by stone, its rubble carried off the Mount and the bedrock laid bare."
 great_project_type_jip_gp_clear_the_temple_mount_contribution_red_heifer:0 "The Ashes of the Red Heifer"
 great_project_type_jip_gp_clear_the_temple_mount_contribution_red_heifer_desc:0 "No priest may set foot where the Holy of Holies stood until he is cleansed with the waters of the red heifer's ashes. A heifer without blemish must be found, and burned outside the city."
 great_project_type_jip_gp_clear_the_temple_mount_contribution_survey:0 "The Survey of the Mount"
 great_project_type_jip_gp_clear_the_temple_mount_contribution_survey_desc:0 "The sages disagree where the Holy of Holies stood. Let learned men measure the Mount against the Mishnah's tractate Middot before a stone is laid."
 great_project_type_jip_gp_rebuild_the_temple:0 "Rebuild the Temple"
 great_project_type_jip_gp_rebuild_the_temple_possessive:0 "the Temple's"
 great_project_type_jip_gp_rebuild_the_temple_desc:0 "$great_project_type_tooltip_jip_gp_rebuild_the_temple$"
 great_project_type_tooltip_jip_gp_rebuild_the_temple:0 "Raise the House of the Lord in Jerusalem a third time, where Solomon built it and the exiles returned from Babylon rebuilt it.\n\nWhen it stands, the Temple service may begin again, and Kohanism, the faith of the Temple priesthood, may be embraced."
 great_project_type_jip_gp_rebuild_the_temple_contribution_stone:0 "Dressed Stone"
 great_project_type_jip_gp_rebuild_the_temple_contribution_stone_desc:0 "Great stones, costly stones, dressed at the quarry, so that no hammer nor iron tool is heard in the house while it is building."
 great_project_type_jip_gp_rebuild_the_temple_contribution_cedars:0 "Cedars of Lebanon"
 great_project_type_jip_gp_rebuild_the_temple_contribution_cedars_desc:0 "As Hiram of Tyre sent cedar to Solomon, the timber must come down from Lebanon, floated in rafts along the coast to Jaffa."
 great_project_type_jip_gp_rebuild_the_temple_contribution_vestments:0 "The Priestly Vestments"
 great_project_type_jip_gp_rebuild_the_temple_contribution_vestments_desc:0 "The ephod, the robe of blue and the breastplate of twelve stones, one for each tribe, woven for the High Priest as the Torah commands."
 great_project_type_jip_gp_rebuild_the_temple_contribution_vessels:0 "The Golden Vessels"
 great_project_type_jip_gp_rebuild_the_temple_contribution_vessels_desc:0 "The menorah of beaten gold, the table of the showbread and the altar of incense, made anew for the Sanctuary."
 great_project_type_jip_gp_rebuild_the_temple_contribution_levites:0 "The Levites' Song"
 great_project_type_jip_gp_rebuild_the_temple_contribution_levites_desc:0 "Levites trained again in the psalm of each day, to sing on the fifteen steps as their fathers did."
 jip_gp_temple_mount_location_tt:0 "Only at [GetTitleByKey('c_jerusalem').GetName], on the Temple Mount"
 jip_gp_temple_mount_held_tt:0 "[GetTitleByKey('c_jerusalem').GetName] is in your realm"
 jip_gp_temple_mount_jerusalem_tt:0 "You hold the county of [GetTitleByKey('c_jerusalem').GetName], or your vassal does"
 jip_gp_temple_mount_cleared_tt:0 "The Dome of the Rock no longer stands on the Mount"
 jip_gp_temple_jewish_contributor_tt:0 "The contributor is a Jew"
 jip_gp_rebuild_the_temple_building_tt:0 "The [GetBuilding('temple_in_jerusalem_01').GetName] stands again in [GetTitleByKey('c_jerusalem').GetName]"
 jip_clearing_the_temple_mount_opinion:0 "Clearing the Temple Mount"
 jip_jerusalem_lost_to_islam:0 "[GetTitleByKey('c_jerusalem').GetName] is no longer a [holy_site|E] of Islam, and every Muslim faith loses #N 15#! [fervor|E]"
 jip_muslims_resent_temple_mount_clearing:0 "Every Muslim ruler loses #N 40#! [opinion|E] of [CHARACTER.GetName] while the Mount is cleared"
 jip_muslims_resent_temple_mount_clearing_first_past:0 "Every Muslim ruler loses #N 40#! [opinion|E] of you while the Mount is cleared"
 jip_temple_mount_cleared_building_tt:0 "The Dome of the Rock is taken down, and the cleared Mount awaits the Temple"
 jip_temple_mount_cleared_enabled_trigger:0 "The holder is a Jew"
 NOT_jip_temple_mount_cleared_enabled_trigger:0 "The holder is not a Jew"
 building_type_jip_temple_mount_cleared_01:0 "The Cleared Mount"
 building_type_jip_temple_mount_cleared_01_desc:0 "The Temple Mount, cleared to its bedrock and purified, where the Temple will rise again."
 building_jip_temple_mount_cleared_01:0 "The Cleared Mount"
 building_jip_temple_mount_cleared_01_desc:0 "The dome is gone and the bedrock bare. Priests cleansed with the red heifer's ashes keep watch over the place of the Holy of Holies until the Temple rises."
