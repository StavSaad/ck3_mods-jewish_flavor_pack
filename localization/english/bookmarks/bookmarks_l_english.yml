l_english:
 bm_867_jip: "The Jewish World"
 bm_867_jip_desc: "Having been spread all over the world in the past few centuries, the jews have formed many communities, some more important than others.\nIn the year 867 CE, in the period of the Gaonim, the greatest center of jewish thought is in Bagdhad, where the Exilarch, the heir to the line of King David, resides.\nA succession struggle within the exilarchate a few years back caused the people to split into many factions between Bagdhad and Palestine.\nA Radhanite polity in the Caucaus is maintaining the trade routes between Europe and China, and the Kingdom of Semien in Ethiopia is on its death-bed, now a vassal of Solomonids of Abyssinia."
 bookmark_jip_gideon: "Dawit ben Gideon"
 bookmark_jip_gideon_desc: "As the Ras of Beta Israel, Dawit faces an incredible challenge as his realm is put under the rule of the Solomonids.\n\nThe traitorous Christians also claim descent from the wise King Solomon of Israel, yet they forsook his ways long ago. \n\n#bold We did not forget, and we never will forget nor betray our ancestry! The time to rise is nigh and our future is ripe for the claiming – may it be in Abyssinia or our Promised Land.#"
 bookmark_jip_gideon_alt: "Negus Anbasa Wedem of Abbysinia"
 bookmark_jip_radhanite: "The Radhanite Polity"
 bookmark_jip_radhanite_desc: "A Jewish magnate of the Radhanite merchant guild holds a small domain in the Caucasus, a realm built on trade rather than the sword. As a merchant prince in a land of warriors, they must use cunning and immense wealth to survive among hostile kingdoms. Their greatest asset is their network of contacts, but their greatest weakness is a lack of military might in a world that values steel over gold. \n\n#bold Will they be able to maintain their hold over the trade between Asia and Europe?#"
 bookmark_jip_khazar: "The Khazar Khaganate"
 bookmark_jip_khazar_desc: "The Khagan of the Khazars is a figure unlike any other in 867, a steppe ruler whose conversion to the Jewish faith sets his realm apart from the Christian and Muslim empires surrounding him. Though his religious authority is absolute, the true military power of his realm rests with the Bey, creating a delicate balance of power. His greatest challenge is not just defending his borders, but managing a fragile empire from within while navigating a world that views his unique piety with suspicion. \n\n#bold Will the Khazars spread the Jewish religion? Or will they succumb to the other turkic nomads?#"
 bookmark_jip_exilarch_chisdai_ii: "Chisdai II ben Natronai"
 bookmark_jip_exilarch_chisdai_ii_desc: "Exilarch Chisdai II, the Prince of the Exile, is a Jewish magnate whose authority comes not from the sword, but from a lineage said to stretch back to King David. As a direct vassal of the mighty Abbasid Caliphate, he serves as the spiritual and legal leader for his people while also acting as a tax collector for his Muslim liege. His power is great, but it is fragile—dependent entirely on political maneuvering and the goodwill of his powerful liege."
 bookmark_jip_exilarch_karaite_boaz: "Boaz I ben Yehoshafat"
 bookmark_jip_exilarch_karaite_boaz_desc: "Boaz I is the Karaite Exilarch, the head of a Jewish sect that rejects the Talmud. He is a direct rival to the more powerful Rabbinic Exilarch, whose legitimacy is recognized by the Abbasid court. As a leader of a minority within a minority, his survival depends on political cunning and diplomacy in a world that views his faith as a schism."
 bookmark_jip_pinchas: "Pinchas ben Abdimi"
 bookmark_jip_pinchas_desc: "Pinchas ben Abdimi is a Davidic claimant in the Holy Land, but he holds no land of his own. A scion of a lineage said to stretch back to King David himself, he is a man of immense religious and dynastic importance to the Jewish people, yet he exists as a landless guest in the court of his Muslim liege. His claim is great, but his power is nonexistent. He must rely on cunning and piety alone, for his greatest challenge is to find a way to forge a new kingdom from nothing and restore the glory of Israel."