l_english:
 ### The festivals: feast variants (tools/make_feast_override.py) and their events (events/jip_feast_events.txt)

 jip_feast_type_akitu:0 "Akitu"
 jip_feast_type_akitu_desc:0 "$EFFECT_LIST_BULLET$ The gods are honoured through the days of the New Year, and you are humbled before them and reinvested\n$EFFECT_LIST_BULLET$ The Final Toast fixes the fates of the year: [legitimacy|E], [prestige|E] and [piety|E], [opinion|E] of your [vassals|E], and a year's omen\n$EFFECT_LIST_BULLET$ More [piety|E] and [legitimacy|E] at a [holy_site|E] of your [faith|E]\n$EFFECT_LIST_BULLET$ A ruler who lets Akitu lapse for 8 years loses [legitimacy|E] and [piety|E]\n\n#weak In Nisannu the gods go out to the akitu house, and the king takes the god by the hand.#!"
 jip_feast_type_akitu_valid_tt:0 "You have held Akitu in the past 5 years"
 jip_feast_type_nisan:0 "Feast of Nisan"
 jip_feast_type_nisan_desc:0 "$EFFECT_LIST_BULLET$ The Moon's fast is broken and Sin and the seven planets receive their sacrifices\n$EFFECT_LIST_BULLET$ The Final Toast brings [piety|E] and learning, and a year's omen\n$EFFECT_LIST_BULLET$ More [piety|E] and [prestige|E] at a [holy_site|E] of your [faith|E]\n\n#weak The year of Harran begins in Nisan, when the Lord of the Moon is honoured above all.#!"
 jip_feast_type_nisan_valid_tt:0 "You have held the Feast of Nisan in the past 5 years"
 jip_feast_type_parwanaya:0 "Parwanaya"
 jip_feast_type_parwanaya_desc:0 "$EFFECT_LIST_BULLET$ Five days outside the months, of white robes and baptism in living water, when the dead are remembered\n$EFFECT_LIST_BULLET$ The Final Toast brings [piety|E], [stress|E] loss and a year of better health\n$EFFECT_LIST_BULLET$ More [piety|E] at a [holy_site|E] of your [faith|E]\n\n#weak The Mandaean year has no leap days, so Parwanaya falls a day earlier every four years.#!"
 jip_feast_type_parwanaya_valid_tt:0 "You have held Parwanaya in the past 5 years"
 jip_feast_type_dehwa_rabba:0 "Dehwa Rabba"
 jip_feast_type_dehwa_rabba_desc:0 "$EFFECT_LIST_BULLET$ The Mandaean New Year: a quiet feast behind closed doors, through the night of seclusion\n$EFFECT_LIST_BULLET$ The Final Toast brings [piety|E], [stress|E] loss and a year's omen\n$EFFECT_LIST_BULLET$ More [piety|E] at a [holy_site|E] of your [faith|E]\n\n#weak The Mandaean year has no leap days, so the New Year falls a day earlier every four years.#!"
 jip_feast_type_dehwa_rabba_valid_tt:0 "You have held Dehwa Rabba in the past 5 years"
 jip_feast_type_pesach:0 "Pesach"
 jip_feast_type_pesach_desc:0 "$EFFECT_LIST_BULLET$ The seder of the fifteenth of Nisan: the four cups, the children's questions, matzah and bitter herbs, and the telling of the Exodus\n$EFFECT_LIST_BULLET$ The Final Toast brings [piety|E] and a year of devotion, or [prestige|E] and [legitimacy|E] if you hold Jerusalem\n$EFFECT_LIST_BULLET$ More for an Exilarch's seder, for the paschal lamb at a rebuilt Temple, and for the Samaritans' lamb on Mount Gerizim\n\n#weak \"In every generation one must see oneself as if one had gone out of Egypt.\"#!"
 jip_feast_type_pesach_valid_tt:0 "You have held a Pesach seder in the past 5 years"

 # Modifiers (common/modifiers/jip_feast_modifiers.txt)
 jip_akitu_fates_good:0 "Fates Fixed: Favourable"
 jip_akitu_fates_good_desc:0 "At Akitu the gods fixed a good fate for this ruler's year."
 jip_akitu_fates_neutral:0 "Fates Fixed"
 jip_akitu_fates_neutral_desc:0 "At Akitu the gods fixed the fates of this ruler's year."
 jip_akitu_fates_bad:0 "Fates Fixed: Ill-Omened"
 jip_akitu_fates_bad_desc:0 "No tears came at Akitu. The god is angry, and the priests foretell enemies rising."
 jip_akitu_largesse_modifier:0 "Akitu Largesse"
 jip_akitu_largesse_modifier_desc:0 "The ruler scattered silver along the processional way at Akitu."
 jip_akitu_neglected_1:0 "Akitu Neglected"
 jip_akitu_neglected_1_desc:0 "This ruler has not kept the New Year for years, neither Akitu nor, for Sinites, the Feast of Nisan. The priests remember how Nabonidus let the festival lapse."
 jip_akitu_neglected_2:0 "Akitu Long Neglected"
 jip_akitu_neglected_2_desc:0 "The gods have not gone out to the akitu house in this ruler's reign for many years, and the priests say openly that the god has turned away."
 jip_nisan_omen_good:0 "Favour of the Moon"
 jip_nisan_omen_good_desc:0 "At the Feast of Nisan the signs of Sin were good."
 jip_nisan_omen_neutral:0 "The Moon's Year"
 jip_nisan_omen_neutral_desc:0 "This ruler kept the Feast of Nisan."
 jip_nisan_omen_bad:0 "The Moon Darkened"
 jip_nisan_omen_bad_desc:0 "At the Feast of Nisan the signs of Sin were dark."
 jip_parwanaya_purified:0 "Washed at Parwanaya"
 jip_parwanaya_purified_desc:0 "Baptised in living water during the five days of Parwanaya."
 jip_dehwa_rabba_good:0 "A Bright New Year"
 jip_dehwa_rabba_good_desc:0 "The Book of the Zodiac promised this ruler a good year."
 jip_dehwa_rabba_neutral:0 "The New Year Kept"
 jip_dehwa_rabba_neutral_desc:0 "This ruler kept the night of seclusion at Dehwa Rabba."
 jip_dehwa_rabba_bad:0 "A Dark New Year"
 jip_dehwa_rabba_bad_desc:0 "The omens of Dehwa Rabba foretell a hard year."

 # Opinions (common/opinion_modifiers/jip_opinion_modifiers.txt)
 jip_akitu_reinvested_opinion:0 "Reinvested at Akitu"
 jip_festival_guest_opinion:0 "Shared the Festival"

 ### AKITU
 jip_feast.1001.t:0 "Akitu: The Purification"
 jip_feast.1001.desc:0 "Before dawn the high priest rises, washes in river water and prays alone before the god. A ram is slaughtered, its body rubbed against the temple walls and thrown into the river to carry the year's impurity away.\n\nThen the priests chant the Enuma Elish from beginning to end: how Tiamat raised her monsters against the gods, how the young god alone dared to face her, split her body in two and made heaven and earth from its halves, and how the gods in thanks gave him the tablet of destinies."
 jip_feast.1001.a:0 "Every line is holy."
 jip_feast.1001.b:0 "Have them chant it in the hall, before all my guests."
 jip_feast.1001.c:0 "Give me the tablets. I will read it myself."

 jip_feast.1002.t:0 "Akitu: The King Humbled"
 jip_feast.1002.desc:0 "On the fifth day you come alone before the god. The high priest takes your sceptre, your ring and your crown, and lays them at the god's feet. You kneel and swear: #EMP I have not sinned, lord of the lands, I have not neglected your divinity.#!\n\n"
 jip_feast.1002.desc_priest:0 "On the fifth day you come alone before the god. [scope:jip_feast_priest.GetFirstName] takes your sceptre, your ring and your crown, and lays them at the god's feet. You kneel and swear: #EMP I have not sinned, lord of the lands, I have not neglected your divinity.#!\n\n"
 jip_feast.1002.desc_end:0 "Then the priest strikes your cheek and pulls your ear. The whole court knows the rule of the old tablets: if tears come, the god is pleased. If they do not, the god is angry, and the enemy will rise up and bring about your downfall."
 jip_feast.1002.a:0 "Bow your head and take the blow."
 jip_feast.1002.b:0 "Let the tears come."
 jip_feast.1002.c:0 "No priest strikes a king."
 jip_feast.1002.omen_tt:0 "If tears come, the year's omen will be good: more likely if you are #V Humble#! or #V Zealous#!, less if you are #V Arrogant#!"
 jip_feast.1002.omen_likely_tt:0 "The year's omen will very likely be good"
 jip_feast.1002.omen_bad_tt:0 "The year's omen will be bad"

 jip_feast.1003.t:0 "Akitu: The Procession"
 jip_feast.1003.desc:0 "On the ninth day the gods leave their temples. Their statues are carried out in gold and fine cloth along the processional way, through the city gate and out to the akitu house in the fields beyond the walls, while the crowds sing and the priests swing their censers.\n\nAt the head of the procession the king takes the god by the hand, as the kings of Assyria and Babylon did, and leads him out."
 jip_feast.1003.a:0 "I will lead the god on foot."
 jip_feast.1003.b:0 "I ride in the chariot, behind the god."
 jip_feast.1003.c:0 "Scatter silver along the way!"

 jip_feast.1004.t:0 "Akitu: The Fates Are Fixed"
 jip_feast.1004.desc:0 "In the akitu house the gods gather in assembly, as they did when the world was made, and fix the fates of the land for the coming year. Then they return to the city, and your sceptre and your crown are given back to you.\n\n"
 jip_feast.1004.desc_good:0 "The priests read the signs and smile: the tears came, and the god has fixed a good fate for your reign."
 jip_feast.1004.desc_bad:0 "The priests read the signs in silence. No tears came, and they will not say aloud what the god has fixed for you."
 jip_feast.1004.desc_neutral:0 "The priests read the signs and declare the year's fate fixed."
 jip_feast.1004.desc_holy_site:0 "\n\nThe gods went out from one of their own holy cities, as they did in the old days, and the people say the festival has not been kept so well since the kings of Assyria."
 jip_feast.1004.a:0 "So the fates are fixed."
 jip_feast.1004.vassals_tt:0 "Your [vassals|E] see you reinvested"

 jip_feast.1010.t:0 "Akitu Ends"
 jip_feast.1010.desc:0 "The gods have returned to their temples and the fates of the year are fixed. [scope:host.GetTitledFirstName] was humbled before the god and given back [scope:host.GetHerHis] crown, and you saw it all."
 jip_feast.1010.a:0 "A festival as in the days of old."

 jip_feast.1020.t:0 "The Neglected Festival"
 jip_feast.1020.desc:0 "For years the gods have not gone out to the akitu house in your reign. The priests have begun to remind anyone who will listen of Nabonidus, the last king of Babylon, who stayed away from the festival for ten years, and how the god gave his city to the Persians."
 jip_feast.1020.a:0 "I will hold Akitu when I can."
 jip_feast.1020.a_tt:0 "Hold Akitu, a [GetActivityType('activity_feast').GetName] in Nisannu (March or April), to end the neglect. It grows worse after 12 years"
 jip_feast.1020.a_tt_harranian:0 "Hold Akitu or the Feast of Nisan, a [GetActivityType('activity_feast').GetName] in March or April, to end the neglect. It grows worse after 12 years"

 jip_feast.1101.t:0 "The Tablet of Destinies"
 jip_feast.1101.desc:0 "A priest of Nabu, the scribe of the gods, makes his way between the guests. Nabu writes the fates on the tablet of destinies, he says, and he will tell you what is written there for you."
 jip_feast.1101.a:0 "Tell me what is written."
 jip_feast.1101.a_good:0 "A good fate"
 jip_feast.1101.a_bad:0 "A troubling fate"
 jip_feast.1101.b:0 "Take this offering for Nabu instead."

 ### FEAST OF NISAN
 jip_feast.2001.t:0 "Nisan: The Fast Is Broken"
 jip_feast.2001.desc:0 "For thirty days the faithful of Harran have fasted for the Moon, eating nothing from dawn until dusk. Now, on the eighth day of Nisan, the fast is over. The priests bless the bread, and the year of Harran begins."
 jip_feast.2001.a:0 "Break the fast with the priests."
 jip_feast.2001.b:0 "I kept every day of the fast."
 jip_feast.2001.c:0 "At last, food!"

 jip_feast.2002.t:0 "Nisan: The Sacrifice to Sin"
 jip_feast.2002.desc:0 "At the temple the victims wait: a bull for the Lord of the Moon and lambs for the seven planets, and the priests stand ready to open them and read the year in their entrails. On the roof the astrologers watch the sky, waiting for the Moon to show its sign."
 jip_feast.2002.a:0 "A white bull for the Moon."
 jip_feast.2002.b:0 "Let the astrologers read the sky."
 jip_feast.2002.c:0 "Lambs will do."
 jip_feast.2002.omen_likely_tt:0 "The year's omen will likely be good"
 jip_feast.2002.omen_learning_tt:0 "The year's omen depends on your [learning|E]"
 jip_feast.2002.omen_tt:0 "The year's omen is fixed by chance"

 jip_feast.2004.t:0 "Nisan: The Mystery of the North"
 jip_feast.2004.desc:0 "At the full moon the initiated go down into the dark chamber for the mystery of the North, which no outsider may see. What is done there you may never tell, but you come up into the moonlight changed.\n\n"
 jip_feast.2004.desc_good:0 "The Moon shone clear all night: Sin is pleased."
 jip_feast.2004.desc_bad:0 "Clouds hid the Moon at the height of the mystery, and the priests would not meet your eyes."
 jip_feast.2004.desc_neutral:0 "The priests declare the Lord of the Moon honoured for another year."
 jip_feast.2004.desc_holy_site:0 "\n\nThe feast was kept in a holy city of the faith, as it was when the Temple of Sin still stood in all its glory."
 jip_feast.2004.a:0 "Glory to the Lord of the Moon."
 jip_feast.2004.new_year_tt:0 "The New Year is kept, as at Akitu: the gods will not count it as neglected"

 jip_feast.2010.t:0 "The Feast of Nisan Ends"
 jip_feast.2010.desc:0 "The fast is broken, the sacrifices are burned and the year of Harran has begun. [scope:host.GetTitledFirstName] kept the feast in the old way."
 jip_feast.2010.a:0 "May the Moon light your year."

 jip_feast.2101.t:0 "A Horoscope"
 jip_feast.2101.desc:0 "An astrologer of Harran, his robes stitched with the signs of the planets, asks for the hour of your birth. He works out your stars on a wax tablet while the other guests watch."
 jip_feast.2101.a:0 "And what do the stars say?"
 jip_feast.2101.a_good:0 "A fortunate star"
 jip_feast.2101.a_bad:0 "An unlucky star"
 jip_feast.2101.b:0 "My faith forbids it, but thank you."

 ### PARWANAYA
 jip_feast.3001.t:0 "Parwanaya: Living Water"
 jip_feast.3001.desc:0 "For five days, outside the months of the year, the gates of the world of light stand open. Your household dresses in the white rasta and goes down to the river, where the priests wait in the living water to baptise the faithful."
 jip_feast.3001.a:0 "Go down into the river."
 jip_feast.3001.b:0 "Bring the whole household to the river."
 jip_feast.3001.b_tt:0 "Your [courtiers|E] of your [faith|E] are baptised with you"
 jip_feast.3001.c:0 "Pay the priests to baptise the poor."

 jip_feast.3002.t:0 "Parwanaya: The Meal for the Souls"
 jip_feast.3002.desc:0 "On the last days of Parwanaya the living feed the dead. The priests consecrate bread, fruit and fish, and the meal is eaten for the souls of those who have gone before, so that they may rise to the world of light."
 jip_feast.3002.a:0 "For my forefathers."
 jip_feast.3002.b:0 "For all the faithful dead."

 jip_feast.3004.t:0 "Parwanaya Ends"
 jip_feast.3004.desc:0 "The five days are over, the gates of light close and the months of the year begin again. You feel washed clean."
 jip_feast.3004.desc_holy_site:0 "\n\nYou were baptised in the waters of a holy place of the faith, where the living water runs purest."
 jip_feast.3004.a:0 "Life be praised."

 jip_feast.3010.t:0 "Parwanaya Ends"
 jip_feast.3010.desc:0 "The five days are over. [scope:host.GetTitledFirstName] kept Parwanaya with white robes and living water, and fed the souls of the dead."
 jip_feast.3010.a:0 "A blessed festival."

 jip_feast.3101.t:0 "Into the River"
 jip_feast.3101.desc:0 "The priests stand waist-deep in the river, and one of [scope:activity.GetHost.GetFirstNamePossessive] household beckons you down the bank to join the white-robed crowd in the water."
 jip_feast.3101.a:0 "Go down into the water."
 jip_feast.3101.b:0 "Watch from the bank."

 ### DEHWA RABBA
 jip_feast.4001.t:0 "Dehwa Rabba: The Night of Seclusion"
 jip_feast.4001.desc:0 "On the eve of the New Year the guardian spirits leave the world to greet the King of Light, and for thirty-six hours the world is unguarded. No Mandaean may leave the house, touch the river or eat meat until they return. Your household has filled the storerooms, barred the doors and gathered by the lamps."
 jip_feast.4001.a:0 "Keep vigil in prayer."
 jip_feast.4001.b:0 "Read the year's omens in the Book of the Zodiac."
 jip_feast.4001.c:0 "I want to see the unguarded world."
 jip_feast.4001.omen_tt:0 "The year's omen is fixed by chance: more likely good if you are #V Zealous#!"
 jip_feast.4001.omen_learning_tt:0 "The year's omen depends on your [learning|E]"
 jip_feast.4001.omen_bad_tt:0 "You will need baptising again, and the year's omen will be bad"

 jip_feast.4002.t:0 "Dehwa Rabba: The New Year"
 jip_feast.4002.desc:0 "The guardians have returned. The doors are opened, those who slipped out are taken to the river to be baptised again, and the household goes out to greet the New Year."
 jip_feast.4002.a:0 "Visit the elders and the priests."
 jip_feast.4002.b:0 "Gifts for the whole household!"
 jip_feast.4002.b_tt:0 "Your [courtiers|E] receive New Year's gifts"

 jip_feast.4004.t:0 "Dehwa Rabba: The Year Begins"
 jip_feast.4004.desc:0 "The New Year has come, and the household sits down to the first feast of the year.\n\n"
 jip_feast.4004.desc_good:0 "The signs for the year are bright."
 jip_feast.4004.desc_bad:0 "The signs for the year are dark, and the priests advise caution."
 jip_feast.4004.desc_neutral:0 "The priests bless the year."
 jip_feast.4004.desc_holy_site:0 "\n\nThe New Year was greeted in a holy place of the faith, and the priests say the year is blessed for it."
 jip_feast.4004.a:0 "A good year to us all."

 jip_feast.4010.t:0 "Dehwa Rabba Ends"
 jip_feast.4010.desc:0 "The night of seclusion is over and the year has begun. You spent the unguarded hours behind [scope:host.GetTitledFirstNamePossessive] doors."
 jip_feast.4010.a:0 "A good year to this house."

 jip_feast.4101.t:0 "Tales in the Night"
 jip_feast.4101.desc:0 "The doors are barred and no one may leave. To pass the long hours of the seclusion an old priest tells stories by the lamps: of the King of Light, of Hibil Ziwa who went down into the darkness, and of the souls rising through the watch-houses."
 jip_feast.4101.a:0 "Listen through the night."
 jip_feast.4101.b:0 "How many hours are left?"

 ### Pesach (jip_feast.5000s)
 jip_pesach_next_year_in_jerusalem:0 "Next Year in Jerusalem"
 jip_pesach_next_year_in_jerusalem_desc:0 "This character ended the seder with the old hope, and keeps it through the year."
 jip_pesach_this_year_in_jerusalem:0 "This Year in Jerusalem"
 jip_pesach_this_year_in_jerusalem_desc:0 "This character kept Pesach as ruler of Jerusalem, and the whole House of Israel has heard of it."

 jip_feast.5001.t:0 "Pesach: The Four Cups"
 jip_feast.5001.desc:0 "The house has been searched for leaven by candlelight, and the last crumbs burned. Now the table is laid with matzah, bitter herbs and the first cup of wine. I raise it and say the Kiddush over the festival of our freedom.\n\n"
 jip_feast.5001.desc_haggadah:0 "Beside each place lies the Haggadah, the telling, and tonight we will read it to the end, cup by cup, as the sages ordained."
 jip_feast.5001.desc_karaite:0 "We keep no rabbinic Haggadah at this table. Our elders watched the barley ripen and the new moon rise to fix the month, as the Torah commands, and tonight we read the going-out from Egypt from the Torah itself."
 jip_feast.5001.desc_samaritan:0 "At twilight the lambs were slaughtered on Mount Gerizim, as they have been every year since Joshua's day, and now they are roasting whole over the fire pits."
 jip_feast.5001.desc_haymanot:0 "The kahenat, our priests, have offered the lamb as the Orit commands, and the whole village has come to the Fasika."
 jip_feast.5001.desc_temple:0 "And this year, for the first time since the Romans burned it, the priests of the Temple slaughtered the paschal lamb in Jerusalem, as in the days of our fathers."
 jip_feast.5001.a:0 "Four cups, each in its place."
 jip_feast.5001.b:0 "Watered wine, and a clear head for the telling."
 jip_feast.5001.c:0 "Four cups? Elijah will not mind a fifth."

 jip_feast.5002.t:0 "Pesach: Why Is This Night Different?"
 jip_feast.5002.desc_child_haggadah:0 "The second cup is poured, and [jip_seder_child.GetFirstName], the youngest at the table, stands on the bench and asks the questions, as children have asked them since the Mishnah was written: \"Why is this night different from all other nights? On all other nights we eat leavened bread or matzah, and tonight only matzah...\"\n\nEvery eye turns to me for the answer."
 jip_feast.5002.desc_child_torah:0 "[jip_seder_child.GetFirstName], the youngest at the table, asks the question the Torah puts in a child's mouth: \"What do you mean by this service?\"\n\nAnd the Torah tells me how to answer."
 jip_feast.5002.desc_alone:0 "There is no child at the table to ask the questions. The sages foresaw this: when there is no one else, the host asks them, even when the host is a scholar who knows every answer."
 jip_feast.5002.desc_exilarch:0 "\n\nAt the Exilarch's table sit the heads of the academies of Sura and Pumbedita, and the scholars are waiting to hear how the Prince of the Captivity tells the story of the going-out from Egypt."
 jip_feast.5002.a:0 "\"You shall tell your child on that day...\""
 jip_feast.5002.b:0 "Let the sages at the table expound it."
 jip_feast.5002.c:0 "Then I will ask, and answer."

 jip_feast.5003.t:0 "Pesach: The Afikoman"
 jip_feast.5003.desc:0 "The meal is over, and it is time for the afikoman, the last piece of matzah, without which the seder cannot end. But the napkin I wrapped it in is empty.\n\n[jip_seder_child.GetFirstName] is doing a poor job of looking innocent. The afikoman, [jip_seder_child.GetSheHe] lets me understand, can be found, for a price."
 jip_feast.5003.a:0 "Name your price, little thief."
 jip_feast.5003.b:0 "A coin? Half a coin, and a story."
 jip_feast.5003.c:0 "I will find it myself."
 jip_feast.5003.c_found:0 "Under the Cushion, Of Course"
 jip_feast.5003.c_not_found:0 "Defeated by a Child"

 jip_feast.5004.t:0 "Pesach: Elijah's Cup"
 jip_feast.5004.desc:0 "A cup of wine stands untouched in the middle of the table, poured for Elijah the prophet, who will come to announce the redemption. Before the last psalms, the door is opened for him, and the whole table falls silent and listens to the night."
 jip_feast.5004.a:0 "Open the door wide."
 jip_feast.5004.a_empty:0 "Only the Wind"
 jip_feast.5004.a_stranger:0 "A Stranger at the Door"
 jip_feast.5004.stranger_toast:0 "A Guest at the Seder"
 jip_feast.5004.stranger_tt:0 "A wandering scholar stood at the door. [jip_seder_guest.GetFirstName] has joined your court"
 jip_feast.5004.b:0 "Open it a crack, and keep a hand on the bolt."

 jip_feast.5006.t:0 "Pesach: Eaten in Haste"
 jip_feast.5006.desc_lamb:0 "\"This is how you shall eat it: your loins girded, your sandals on your feet and your staff in your hand, and you shall eat it in haste.\" We eat the lamb standing, dressed for a journey, roasted whole with its bitter herbs and unleavened bread, and nothing of it may be left until morning."
 jip_feast.5006.desc_karaite:0 "Our teachers read the commandment of leaven more strictly than the Rabbanites do: no fire is kindled, and no grain that could rise is in the house. It is a hard night, and a holy one."
 jip_feast.5006.a:0 "By the letter of the Torah."
 jip_feast.5006.b:0 "The meaning matters more than the letter."

 jip_feast.5005.t:0 "Next Year in Jerusalem"
 jip_feast.5005.desc:0 "The last cup is drunk and the last psalm sung. Around the table, my household and my guests rise together for the words that close the seder."
 jip_feast.5005.desc_temple:0 "\n\nThis year the lamb was offered in the Temple, and those who went up to Jerusalem ate it in its courts, as the Torah commands."
 jip_feast.5005.desc_gerizim:0 "\n\nWe kept the feast on Mount Gerizim itself, the chosen place, where our priests offered the lamb as they have done for two thousand years."
 jip_feast.5005.desc_exilarch:0 "\n\nThe heads of the academies bless the house of David, and the whole Captivity will hear that the Exilarch kept the seder as the house of David always has."
 jip_feast.5005.desc_this_year:0 "\n\n\"This year in Jerusalem!\" For once the words are no prayer but the plain truth: the city is mine."
 jip_feast.5005.desc_next_year:0 "\n\n\"Next year in Jerusalem!\""
 jip_feast.5005.a:0 "Next year in Jerusalem."
 jip_feast.5005.a_this_year:0 "This year in Jerusalem!"

 jip_feast.5010.t:0 "Pesach: The Seder Ends"
 jip_feast.5010.desc:0 "The seder at [host.GetTitledFirstName]'s table has ended late into the night, with songs, and children asleep under the table."
 jip_feast.5010.a:0 "A night to remember."

 jip_feast.5020.t:0 "The Household Seder"
 jip_feast.5020.desc:0 "No great feast this year, only my own household around the table, with matzah, bitter herbs and the four cups, and the Haggadah passed from hand to hand.\n\n"
 jip_feast.5020.desc_karaite:0 "No great feast this year, only my own household around the table, reading the going-out from Egypt from the Torah, in a house swept of every grain of leaven.\n\n"
 jip_feast.5020.desc_lamb:0 "No great feast this year, only my own household sharing the paschal lamb, eaten in haste with bitter herbs and unleavened bread.\n\n"
 jip_feast.5020.desc_child:0 "[jip_seder_child.GetFirstName] has been practising the questions for days, and keeps looking at me to see if it is time."
 jip_feast.5020.desc_no_child:0 "It is a quiet table, but it is ours."
 jip_feast.5020.a:0 "Gather everyone. Tonight we are one family."
 jip_feast.5020.b:0 "Ask, [jip_seder_child.GetFirstName]. I am listening."
 jip_feast.5020.c:0 "A short seder, and early to bed."

 jip_feast.5101.t:0 "Pesach: Dayenu"
 jip_feast.5101.desc:0 "The table has started on Dayenu, the song of all God's gifts, each one alone enough for us: had He brought us out of Egypt and not split the sea for us, dayenu! The verses go on and on, and the refrain grows louder each time."
 jip_feast.5101.desc_gentile:0 "My hosts have broken into a song with a refrain every child at the table knows: dayenu, \"it would have been enough\". I understand few of the words, but none of the joy is lost on me."
 jip_feast.5101.a:0 "Dayenu!"
 jip_feast.5101.b:0 "Listen, and learn something of my hosts."
