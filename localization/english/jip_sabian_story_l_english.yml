l_english:
 # The Return of the Moon God, the Sabian story (common/story_cycles/jip_story_sabian_revival.txt)
 story_jip_sabian_revival: "The Return of the Moon God"
 story_jip_sabian_revival_desc: "The Sabians of Harran kept the old gods of Mesopotamia alive under Christian emperors and Muslim caliphs, calling themselves by the Book's name for a protected people. Now their scholars serve the Caliph in Baghdad. Can a house of star-readers win a place for its people, go home to Harran, and see the Moon God's temple rise again?"
 decision_group_type_jip_story_sabian_revival: "The Return of the Moon God"
 JIP_SABIAN_STORY_ACT: "[Story.GetOwner.Custom('JipSabianStoryAct')]"
 jip_sabian_story_act_1: "Act I: The Sabians of Baghdad. Win the Sabians a name at the Muslim courts, and keep the old mysteries in secret."
 jip_sabian_story_act_2: "Act II: The Return to Harran. The Sabians' name is made; the road home lies open."
 JIP_SABIAN_STANDING: "Standing of the Sabians"
 JIP_SABIAN_STANDING_TT: "How the Muslim courts regard the Sabians. It rises with translations, horoscopes and cures for Muslim patrons, Sabian Court Astrologers at Muslim courts, a claim to the Book well defended, and the house's answers in this story; at 10, the first act ends."
 JIP_SABIAN_PATRON: "Patron"
 JIP_SABIAN_INITIATES: "Keepers of the Mysteries"
 jip_sabian_standing_up_1_tt: "The Sabians' standing rises by 1"
 jip_sabian_standing_up_2_tt: "The Sabians' standing rises by 2"
 jip_sabian_standing_up_3_tt: "The Sabians' standing rises by 3"
 jip_sabian_standing_down_1_tt: "The Sabians' standing falls by 1"
 jip_sabian_standing_down_2_tt: "The Sabians' standing falls by 2"
 jip_sabian_standing_down_3_tt: "The Sabians' standing falls by 3"
 jip_sabian_story_astrologers_toast: "Sabian Astrologers at the Muslim Courts"

 jip_sabian_keep_the_mysteries_decision: "Keep the Mysteries"
 jip_sabian_keep_the_mysteries_decision_desc: "Before the Muslims, we are the Sabians of the Book, with Hermes for our prophet. Among ourselves we still remember the Moon God of Harran and the old gods who stood beside him. The mysteries must be passed on, quietly, to those of the house who can keep them, or they will die with the old men."
 jip_sabian_keep_the_mysteries_decision_tooltip: "Initiate a member of your house into the old gods' mysteries"
 jip_sabian_keep_the_mysteries_decision_confirm: "Light the lamps below"
 jip_sabian_keep_the_mysteries_candidate_tt: "You, or an adult of your [house|E] or your [spouse|E] at your [court|E], keep the Sabian [rite|E] and have no secret [faith|E]"
 jip_sabian_keep_the_mysteries_effect_tt: "You or a member of your [house|E] at court, the most learned first, may secretly take up [GetFaithByKey('mesopotamian_pagan').GetName] as a secret [faith|E]"

 jip_sabian_story.1001.t: "The Sabians of Baghdad"
 jip_sabian_story.1001.desc: "Baghdad is full of scholars, but few of them are like us. "
 jip_sabian_story.1001.desc_thabit: "Muhammad ibn Musa found me changing money in Harran and brought me here, to the Banu Musa and their books. I have given the Caliph's city Euclid and Archimedes in Arabic; now the Sabians who followed me here look to me as their head, though the elders of Harran have cast me out for carelessness of the old rites. They are wrong: I keep them still, below my house, where no Muslim sees. "
 jip_sabian_story.1001.desc_other: "Since Thabit ibn Qurra came here from Harran, the Sabians of Baghdad have read the stars, measured the heavens and turned the Greeks into Arabic for the Caliph's court. "
 jip_sabian_story.1001.desc_end: "We are tolerated for what we know, and for a name: the Book promises its protection to the Sabians, and we are careful to be them.\n\nBut Harran remembers older things. Sin, the Moon, still has his temple there, and his feasts are kept behind closed doors. If the Sabians could win enough favour at the courts, could they go home, and could the Moon God one day be worshipped openly again?"
 jip_sabian_story.1001.a: "We begin in the palace, and we end in Harran"
 jip_sabian_story.1001.tt: "Raise the Sabians' standing: complete translation, horoscope and physician [task_contracts|E] for Muslim patrons, defend your claim to be a people of the Book, and answer well when the courts test you. Meanwhile, use the Keep the Mysteries decision to pass the old faith to your house in secret"

 jip_sabian_story.1010.t: "A Patron of the Sciences"
 jip_sabian_story.1010.desc: "[jip_patron.GetTitledFirstName] has heard of the Sabians' work on the motion of the stars and the measure of the year, and would like to see a Sabian dispute geometry with the court's scholars. A good showing before [jip_patron.GetHerHim] would do our people more good than a bag of silver. A poor one would be remembered too."
 jip_sabian_story.1010.a: "I will go myself"
 jip_sabian_story.1010.a.success: "The proofs hold, and the court is impressed"
 jip_sabian_story.1010.a.failure: "A Muslim scholar finds the flaw first"
 jip_sabian_story.1010.b: "Let [jip_pupil.GetFirstName] go and learn from it"
 jip_sabian_story.1010.c: "My work cannot wait"

 jip_sabian_story.1020.t: "The Elders of Harran"
 jip_sabian_story.1020.desc: "A letter has come from Harran. The elders of the Sabians there hold that the Sabians of Baghdad have grown too close to the Caliph and too careless of the old rites, and that a community with two heads is a community that will be broken.\n\nThey are not wrong that we need each other. Harran keeps the temple; Baghdad keeps the Caliph's ear."
 jip_sabian_story.1020.desc_thabit: "A letter has come from Harran, from the same elders who cast me out for what I taught. They hold that the Sabians of Baghdad have grown too close to the Caliph and too careless of the old rites, and that a community with two heads is a community that will be broken.\n\nThey are not wrong that we need each other. Harran keeps the temple; Baghdad keeps the Caliph's ear."
 jip_sabian_story.1020.a: "I will go to them, and listen"
 jip_sabian_story.1020.b: "Send silver for the temple, and kind words"
 jip_sabian_story.1020.c: "The Sabians of Baghdad answer to no one in Harran"

 jip_sabian_story.1030.t: "A Disputation on the Sabians"
 jip_sabian_story.1030.desc: "A jurist at [jip_patron.GetTitledFirstName]'s court has been saying in public what many think: that the Sabians of the Book were some people of long ago, and the star-worshippers of Harran have only borrowed their name to escape the sword. Now [jip_patron.GetSheHe] has asked me to answer him before the court."
 jip_sabian_story.1030.a: "Answer with Hermes and the books of Seth"
 jip_sabian_story.1030.a.success: "The jurist has no reply"
 jip_sabian_story.1030.a.failure: "The court laughs at the wrong man"
 jip_sabian_story.1030.b: "Ask [jip_patron.GetTitledFirstName] to end this"
 jip_sabian_story.1030.c: "Say nothing, and let it pass"

 jip_sabian_story.1040.t: "Whispers in the Suq"
 jip_sabian_story.1040.desc: "Someone has seen [jip_initiate.GetFirstName] at the old rites, and the story is going round the markets: that the Sabians of Baghdad still pray to the Moon and the planets behind closed doors. So far it is only talk. It must not become a case before the qadi."
 jip_sabian_story.1040.desc_self: "Someone has seen me at the old rites, and the story is going round the markets: that the head of the Sabians of Baghdad still prays to the Moon and the planets behind closed doors. So far it is only talk. It must not become a case before the qadi."
 jip_sabian_story.1040.a: "Silver closes mouths"
 jip_sabian_story.1040.b: "It was only philosophy: the Greeks wrote of the planets too"
 jip_sabian_story.1040.b.success: "The talk dies down"
 jip_sabian_story.1040.b.failure: "No one believes it"
 jip_sabian_story.1040.c: "[jip_initiate.GetFirstName] must give it up"

 jip_sabian_story.1050.t: "The Stars over the Palace"
 jip_sabian_story.1050.desc: "Two planets meet this season, and the court is uneasy. [jip_patron.GetTitledFirstName] has sent for a Sabian to say what the meeting means for [jip_patron.GetHerHim] and [jip_patron.GetHerHis] realm. The tables give an honest answer, but not a happy one."
 jip_sabian_story.1050.a: "Tell [jip_patron.GetHerHim] what the stars say"
 jip_sabian_story.1050.a.success: "[jip_patron.GetSheHe|U] heeds the warning, and is grateful"
 jip_sabian_story.1050.a.failure: "[jip_patron.GetSheHe|U] does not like what [jip_patron.GetSheHe] hears"
 jip_sabian_story.1050.b: "Tell [jip_patron.GetHerHim] what [jip_patron.GetSheHe] would like to hear"

 jip_sabian_story.1090.t: "The Road to Harran"
 jip_sabian_story.1090.desc: "The courts no longer ask whether the Sabians are a people of the Book. They ask for our astrologers, our physicians and our translators by name, and they listen to what we say.\n\nThe Sabians of Baghdad have done what they came to do. Now Harran calls: its temple, its old families, and the Moon over its walls. A people with friends at court can think of going home."
 jip_sabian_story.1090.a: "To Harran"
 jip_sabian_story.1090.tt: "The first act of the Return of the Moon God ends: the road to Harran opens"

 jip_sabian_story.1100.t: "The Mysteries"
 jip_sabian_story.1100.desc: "When the doors are shut and the lamps are lit below the house, [jip_initiate.GetFirstName] will learn what the Harranians never told the Muslims: the names of the seven, the Moon's feasts, and Sin, Lord of Harran, who is not yet dead. After tonight, [jip_initiate.GetSheHe] will keep the Sabian name by day and the old gods by night."
 jip_sabian_story.1100.desc_self: "When the doors are shut and the lamps are lit below the house, the last of the old men will teach me what the Harranians never told the Muslims: the names of the seven, the Moon's feasts, and Sin, Lord of Harran, who is not yet dead. After tonight, I will keep the Sabian name by day and the old gods by night."
 jip_sabian_story.1100.a: "Let the mysteries pass on"
 jip_sabian_story.1100.b: "Not yet: the time is not right"

 # Act II: the Return to Harran
 jip_sabian_story_act_3: "Act III: Throw Off the Caliph. Harran is the house's again; only an independent ruler can bring back the old gods."
 jip_sabian_harranian_army: "The Harranians"

 jip_sabian_petition_for_harran_decision: "Petition for Harran"
 jip_sabian_petition_for_harran_decision_desc: "Our standing at court has never been higher. Harran lies in our patron's realm, and a ruler can give a county to whomever they please. Who better to govern the city of the Sabians than the house that has served them so well?"
 jip_sabian_petition_for_harran_decision_tooltip: "Ask your patron to give you the county of Harran"
 jip_sabian_petition_for_harran_decision_confirm: "Send the petition"
 jip_sabian_patron_can_give_harran_tt: "Harran is held by your patron, or by someone in your patron's [realm|E]"
 jip_sabian_petition_for_harran_effect_tt: "Your patron decides whether to give you Harran. A patron who has recognised the Sabians, employs a Sabian Court Astrologer or thinks well of you is more likely to agree; one who would lose Harran from their own domain, or anger a loyal count, less so"

 jip_sabian_buy_harran_decision: "Buy the Tax Farm of Harran"
 jip_sabian_buy_harran_decision_desc: "Counts need silver more often than they need cities, and Harran's taxes are hard to gather from a people who keep their own feasts. Offer its count a price for the farm of Harran, its revenues and its government, and let the Sabians collect from the Sabians."
 jip_sabian_buy_harran_decision_tooltip: "Offer Harran's count gold for the county"
 jip_sabian_buy_harran_decision_confirm: "Make the offer"
 jip_sabian_buy_harran_gold_tt: "You have at least [GetPlayer.MakeScope.ScriptValue('jip_sabian_harran_price_value')|0] @gold_icon! gold, the price of Harran"
 jip_sabian_buy_harran_effect_tt: "Harran's count decides whether to sell. The gold is paid only if they agree. A count in need of money, or a greater ruler for whom Harran is one county among many, sells more readily; a count whose only county or seat it is, rarely"

 jip_sabian_raise_the_harranians_decision: "Raise the Harranians"
 jip_sabian_raise_the_harranians_decision_desc: "Harran's masters are at war, and their eyes are elsewhere. The Sabians of Harran have been taxed, questioned and despised for two hundred years; they need only someone to lead them. If the house calls, the city will rise."
 jip_sabian_raise_the_harranians_decision_tooltip: "Lead the Sabians of Harran in a rising for the county"
 jip_sabian_raise_the_harranians_decision_confirm: "Light the beacons"
 jip_sabian_harran_crisis_tt: "Harran's count, or the ruler at the top of Harran's [realm|E], is at war"
 jip_sabian_harran_is_sabian_tt: "The county of Harran keeps the Sabian [faith|E]"
 jip_sabian_raise_the_harranians_effect_tt: "You gain a pressed [claim|E] on Harran and go to war for it against its count, at the head of an army of Harranians that serves until the war ends"

 jip_sabian_story.2010.t: "A Sabian Asks for Harran"
 jip_sabian_story.2010.desc: "[jip_petitioner.GetTitledFirstName] of the Sabians has come before me with a request: the governorship of Harran, the city of [jip_petitioner.GetHerHis] people.\n\nThe Sabians have served this court well, and Harran's Sabians would be easier to rule through one of their own. But a county given to a star-worshipper's house is a county taken from someone else, and the jurists will talk."
 jip_sabian_story.2010.a: "Harran is [jip_petitioner.GetHerHis]"
 jip_sabian_story.2010.b: "I cannot give it"

 jip_sabian_story.2011.t: "The Governorship of Harran"
 jip_sabian_story.2011.desc: "[jip_harran_liege.GetTitledFirstName] has heard my petition and granted it. The diploma is sealed: the house holds Harran, and the Sabians will be governed by a Sabian for the first time since anyone can remember."
 jip_sabian_story.2011.a: "To Harran, then"

 jip_sabian_story.2012.t: "The Petition Refused"
 jip_sabian_story.2012.desc: "[jip_patron.GetTitledFirstName] has refused my petition for Harran. It was politely done, with praise for the Sabians' learning, but a refusal is a refusal. Perhaps in a few years, or with more friends at court, [jip_patron.GetSheHe] will think again. Or perhaps Harran will have to be had another way."
 jip_sabian_story.2012.a: "There are other roads"

 jip_sabian_story.2020.t: "An Offer for Harran"
 jip_sabian_story.2020.desc: "[jip_buyer.GetTitledFirstName], head of the Sabians of Baghdad, has offered me [SCOPE.ScriptValue('jip_harran_price')|0] @gold_icon! gold for the farm of Harran: its taxes, its courts and its government. The Sabians, [jip_buyer.GetSheHe] says, will collect from the Sabians more easily than I ever could.\n\nIt is a great deal of silver, and Harran has never been an easy city to rule."
 jip_sabian_story.2020.a: "Harran is sold"
 jip_sabian_story.2020.b: "Harran is not for sale"

 jip_sabian_story.2021.t: "The Farm of Harran"
 jip_sabian_story.2021.desc: "[jip_seller.GetTitledFirstName] has taken the silver, and Harran is ours: its taxes, its courts, and its walls. The Sabians of Harran will be ruled by their own, and the Moon God's temple stands within our county."
 jip_sabian_story.2021.a: "Silver well spent"

 jip_sabian_story.2022.t: "Not for Sale"
 jip_sabian_story.2022.desc: "[jip_seller.GetTitledFirstName] will not sell Harran, at that price or any other. Perhaps [jip_seller.GetSheHe] will change [jip_seller.GetHerHis] mind when [jip_seller.GetHerHis] treasury is empty, or perhaps Harran will have to be had another way."
 jip_sabian_story.2022.a: "We will see"

 jip_sabian_story.2030.t: "Harran Rises"
 jip_sabian_story.2030.desc: "The word went out, and Harran answered. The Sabians have shut the gates against [jip_harran_loser.GetTitledFirstName]'s men, and from the villages of the plain they come in hundreds, with old spears, farm tools and their fathers' swords.\n\nThey have waited a long time for this. Now we must not lose."
 jip_sabian_story.2030.a: "For Harran and the Moon"

 jip_sabian_story.2090.t: "Home to Harran"
 jip_sabian_story.2090.desc: "I have come home to Harran. The old men at the gate wept to see one of their own ride in as its lord, and on the hill the Moon God's temple waits, its doors still shut, its lamps still lit by the few who never stopped.\n\nBut Harran is held of another, and while the house answers to a Muslim lord, the old gods must stay behind closed doors. The Sabians cannot restore what they do not rule outright."
 jip_sabian_story.2090.a: "The Moon rises over Harran"
 jip_sabian_story.2090.tt: "The second act of the Return of the Moon God ends: the house must now rule Harran as an independent ruler"

 # Act III: Throw Off the Caliph
 jip_sabian_story_act_4: "Act IV: Restore the Old Gods. Harran is free; the Temple of Sin can rise again."
 jip_sabian_story_harran_lost_toast: "Harran Is Lost"
 jip_sabian_story_harran_lost_tt: "Without Harran, the Return of the Moon God goes back to its second act: the house must win Harran again"

 jip_sabian_proclaim_freedom_decision: "Proclaim Harran's Freedom"
 jip_sabian_proclaim_freedom_decision_desc: "Harran is ours, but it is held of a Muslim lord, and while it is, the Moon God's doors stay shut. The old gods can only be restored by a ruler who answers to no one. It is time to tell our liege that Harran will govern itself, and to see whether they will let it go or fight to keep it."
 jip_sabian_proclaim_freedom_decision_tooltip: "Demand that your liege let Harran go"
 jip_sabian_proclaim_freedom_decision_confirm: "Send the demand"
 jip_sabian_proclaim_freedom_effect_tt: "Your liege decides whether to let you go. A liege already at war, who thinks well of you or has recognised the Sabians is more likely to agree; a bold one less so. If they refuse, you may go to war for your independence at the head of the Harranians"

 jip_sabian_story.3010.t: "Harran Demands Its Freedom"
 jip_sabian_story.3010.desc: "[jip_rebel.GetTitledFirstName], whom I let rule Harran, now writes that Harran will govern itself and answer to no one. The Sabians have always been a stiff-necked people, and now they have a lord of their own to be stiff-necked for.\n\nI could let them go: Harran is one city, and I have other cares. Or I could remind them whose city it is."
 jip_sabian_story.3010.a: "Let Harran go"
 jip_sabian_story.3010.b: "Harran stays mine"

 jip_sabian_story.3011.t: "The Demand Refused"
 jip_sabian_story.3011.desc: "[jip_harran_overlord.GetTitledFirstName] has answered: Harran stays [jip_harran_overlord.GetHerHis]. The messenger who brought it says the court laughed.\n\nThe Harranians are ready. The old men say that the Moon God gave Harran its walls, and that no one has held them against its own people for long. We could find out."
 jip_sabian_story.3011.a: "Then Harran will win its freedom"
 jip_sabian_story.3011.a.tt: "You go to war for your independence against your liege, at the head of an army of Harranians that serves until the war ends, larger for every other Sabian county in your [realm|E]"
 jip_sabian_story.3011.b: "Not yet"

 jip_sabian_story.3012.t: "Harran Goes Free"
 jip_sabian_story.3012.desc: "[jip_harran_overlord.GetTitledFirstName] has let Harran go. Whether from weariness, wisdom or contempt, the letter is sealed: the house answers to [jip_harran_overlord.GetHerHim] no longer."
 jip_sabian_story.3012.a: "Without a drop of blood"

 jip_sabian_story.3090.t: "Harran Is Free"
 jip_sabian_story.3090.desc: "For the first time since the Romans came, Harran answers to no one but its own. No caliph's governor sits in the citadel, no qadi will ask the Sabians what book they follow.\n\nOn the hill, the Moon God's temple waits. Its stones are old and its roof has fallen, but the Ehulhul stood there before Babylon was great, and it can stand again. The Sabians need only build it, and the gods of their fathers can be worshipped in the open."
 jip_sabian_story.3090.a: "Let the temple rise"
 jip_sabian_story.3090.tt: "The third act of the Return of the Moon God ends. The great project to Restore the Temple of Sin at Harran is now open to you"
