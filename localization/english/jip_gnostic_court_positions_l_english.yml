l_english:
 # Sabian family court positions (jip_gnostic_court_positions.txt)
 jip_muallim_court_position: "Mu'allim"
 jip_muallim_court_position_desc: "The $jip_muallim_court_position$ teaches in the family's school: the geometry of Euclid, the astronomy of Ptolemy and the wisdom of Hermes, as Thabit ibn Qurra taught his sons and pupils."
 jip_rais_al_kahana_court_position: "Ra'is al-Kahana"
 jip_rais_al_kahana_court_position_desc: "The $jip_rais_al_kahana_court_position$, chief of the priests, judges the Sabians by their own law and speaks for their rites before the family."
 jip_shair_court_position: "Sha'ir"
 jip_shair_court_position_desc: "The $jip_shair_court_position$ composes verse and elegant prose in praise of the house, as the Sabian secretaries of Baghdad did for viziers and caliphs."
 jip_kahin_court_position: "Kahin"
 jip_kahin_court_position_desc: "The $jip_kahin_court_position$ keeps the family's rites to the seven planets: the prayers at their hours, the fasts and the sacrifices of the Harranian calendar."
 jip_sabian_almoner_court_position: "Almoner"
 jip_sabian_almoner_court_position_desc: "The $jip_sabian_almoner_court_position$ hands out the family's alms to the poor of the community and buys back Sabians held captive."
 jip_rasul_court_position: "Rasul"
 jip_rasul_court_position_desc: "The $jip_rasul_court_position$ travels between the Sabians of Harran, Raqqa and Baghdad, carrying letters, money and news, and binding them to the house."
 jip_katib_court_position: "Katib"
 jip_katib_court_position_desc: "The $jip_katib_court_position$ keeps the family's letters, accounts and deeds in the chancery style that made the Sabian secretaries famous at the caliph's court."
 jip_sabian_wakil_court_position: "Wakil"
 jip_sabian_wakil_court_position_desc: "The $jip_sabian_wakil_court_position$ acts for the family among the Sabians where the estate lies, apportioning their dues and collecting them."

 # Mandaean family court positions
 jip_ganzibra_court_position: "Ganzibra"
 jip_ganzibra_court_position_desc: "The $jip_ganzibra_court_position$, the treasurer of the faith, is the senior priest who trains and ordains the priests and keeps the books of the Mandaeans."
 jip_tarmida_court_position: "Tarmida"
 jip_tarmida_court_position_desc: "The $jip_tarmida_court_position$ is a priest of the Mandaeans: in white robes and with the myrtle wreath, they baptise the family in living water and say the masses for its dead."
 jip_shganda_court_position: "Shganda"
 jip_shganda_court_position_desc: "The $jip_shganda_court_position$, the deacon, serves the priests at the rites and the poor of the community, and gathers the alms that buy back Mandaean captives."
 jip_izgadda_court_position: "Izgadda"
 jip_izgadda_court_position_desc: "The $jip_izgadda_court_position$ carries the family's messages between the villages of the marshes and the Mandaeans of Basra, Wasit and Khuzestan."
 jip_sapra_court_position: "Sapra"
 jip_sapra_court_position_desc: "The $jip_sapra_court_position$, the scribe, keeps the family's accounts and copies its books, closing each with a colophon naming those who copied it before."
 jip_mandaean_wakil_court_position: "Wakil"
 jip_mandaean_wakil_court_position_desc: "The $jip_mandaean_wakil_court_position$ acts for the family among the Mandaeans where the estate lies, apportioning their dues and collecting them."

