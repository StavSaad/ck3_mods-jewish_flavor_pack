 # Tasks (jip_gnostic_court_position_tasks.txt)
 jip_muallim_train_disciples: "Teach the Sciences"
 jip_muallim_train_disciples_desc: "This character teaches geometry, astronomy and medicine to the Sabians of your court, raising scholars for the family."
 jip_muallim_train_disciples_tt: "Each year, a Sabian courtier may gain [learning|E], more likely the better the [aptitude|E]"
 jip_muallim_train_disciples_toast: "A Pupil of the School"
 jip_ganzibra_train_disciples: "Train Priests"
 jip_ganzibra_train_disciples_desc: "This character teaches the Mandaeans of your court the prayers, the books and the rites, raising priests and scholars for the family."
 jip_ganzibra_train_disciples_tt: "Each year, a Mandaean courtier may gain [learning|E], more likely the better the [aptitude|E]"
 jip_ganzibra_train_disciples_toast: "A Disciple of the Ganzibra"
 jip_rais_al_kahana_judge_community: "Judge the Community"
 jip_rais_al_kahana_judge_community_desc: "This character judges the Sabians' disputes in your name, upholding your authority and the family's good name."
 jip_rais_al_kahana_issue_responsa: "Answer the Faithful"
 jip_rais_al_kahana_issue_responsa_desc: "This character answers questions of the rites sent by the Sabians of distant cities, spreading the renown of your house."
 jip_sabian_almoner_ransom_captives: "Ransom Captives"
 jip_sabian_almoner_ransom_captives_desc: "This character gathers funds to buy back Sabians held captive by other rulers."
 jip_sabian_almoner_ransom_captives_tt: "Each year, a Sabian imprisoned by another ruler may be ransomed and freed, more likely the better the [aptitude|E]"
 jip_sabian_almoner_ransom_captives_toast: "A Captive Redeemed"
 jip_shganda_ransom_captives: "Ransom Captives"
 jip_shganda_ransom_captives_desc: "This character gathers funds to buy back Mandaeans held captive by other rulers."
 jip_shganda_ransom_captives_tt: "Each year, a Mandaean imprisoned by another ruler may be ransomed and freed, more likely the better the [aptitude|E]"
 jip_shganda_ransom_captives_toast: "A Captive Redeemed"
 jip_rasul_gather_donations: "Gather Donations"
 jip_rasul_gather_donations_desc: "This character travels between the Sabian communities, collecting their donations for your house."
 jip_izgadda_gather_donations: "Gather Donations"
 jip_izgadda_gather_donations_desc: "This character travels between the Mandaean villages, collecting their donations for your house."
 jip_rasul_bind_communities: "Bind the Communities"
 jip_rasul_bind_communities_desc: "This character carries your letters to the Sabians of Harran and the other cities, binding them to your house."
 jip_izgadda_bind_communities: "Bind the Communities"
 jip_izgadda_bind_communities_desc: "This character carries your letters to the Mandaeans of the marshes and the cities, binding them to your house."
 jip_katib_keep_estate: "Keep the Estate's Affairs"
 jip_katib_keep_estate_desc: "This character keeps the accounts and contracts of your [domicile|E], so its building goes faster and cheaper."
 jip_sapra_keep_estate: "Keep the Estate's Affairs"
 jip_sapra_keep_estate_desc: "This character keeps the accounts and contracts of your [domicile|E], so its building goes faster and cheaper."
 jip_sabian_wakil_collect_dues: "Collect Dues"
 jip_sabian_wakil_collect_dues_desc: "This character collects the community's dues and apportions its taxes, much of it finding its way to your [domicile|E]."
 jip_mandaean_wakil_collect_dues: "Collect Dues"
 jip_mandaean_wakil_collect_dues_desc: "This character collects the community's dues and apportions its taxes, much of it finding its way to your [domicile|E]."
