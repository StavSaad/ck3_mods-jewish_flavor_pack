l_english:
 building_type_masada_01:1 "Masada"
 building_type_masada_01_desc:0 "Abandoned after its fall to the Romans hundreds of years ago, Masada stands as nothing more then a shadow of its former self."
 masada_01:0 "Ruins of Old Masada"
 masada_01_desc:0 "$building_type_masada_01_desc$"
 masada_02:0 "Restored Masadan Fortifications"
 masada_02_desc:0 "The ancient fortress has been restored; the Roman battery, dismantled and dispersed. \n\nAtop natural walls of bedrock four hundred and fifty meters high, Masada stands rebuilt.\n\nAnd for all ages to come, as long as an Israelite sentry defends these walls, no one – not even a Roman legion – shall breach them."
 masada_03:0 "Grand Fortifications of Masada"
 masada_03_desc:0 "Restored according to the plans drafted by King Herod's architects, Masada contains an extensive garrison built to house a thousand men and thick walls that rise to meet the sky, all atop four hundred and fifty meters of raised bedrock.\n\nIts lavish palaces grant the residents a magnificent view of the Dead Sea."
 building_type_jip_temple_in_jerusalem_01:0 "Temple in Jerusalem"
 building_type_jip_temple_in_jerusalem_01_desc:0 "On Temple Mount, stands the site where Abraham was going to sacrfice his Son to the god. On this spot, the temple of the jews once stood. On this spot, it will stand again."
 jip_temple_in_jerusalem_01:0 "$temple_in_jerusalem_01$"
 jip_temple_in_jerusalem_01_desc:0 "$temple_in_jerusalem_01_desc$"
 building_type_jip_holy_site_ziggurat_01:0 "Ziggurat"
 building_type_jip_holy_site_ziggurat_01_desc:0 "A stepped tower of baked brick, the mountain of the gods, with a shrine on its summit where the god comes down to meet the priests."
 jip_holy_site_ziggurat_01:0 "Ziggurat"
 jip_holy_site_ziggurat_01_desc:0 "$building_type_jip_holy_site_ziggurat_01_desc$"
 building_type_jip_holy_site_classical_temple_01:0 "Temple"
 building_type_jip_holy_site_classical_temple_01_desc:0 "A temple of the gods of Aram in the Greek manner, columns and pediment over a high podium, in a walled court where the people bring their offerings."
 jip_holy_site_classical_temple_01:0 "Temple"
 jip_holy_site_classical_temple_01_desc:0 "$building_type_jip_holy_site_classical_temple_01_desc$"
