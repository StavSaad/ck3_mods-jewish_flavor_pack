l_english:
 game_concept_familial: "Familial"
 game_concept_familial_government: "Familial Government"
 game_concept_familial_governments: "Familial Governments"
 game_concept_familial_i: "@government_type_familial!"
 game_concept_familial_desc: "A $game_concept_familial$ head is an [unlanded|E] [character|E] who leads a family of a protected minority from its [estate|E] in a [city|E].\n\nThey do not hold [land|E] or keep a [council|E]. Instead, the family lives under its [merchant_patron|E], the [ruler|E] of the [county|E] its estate lies in, to whom it pays [taxes|E] and [prestige|E] in return for its rights, and it earns its income from [task_contracts|E] and [trade_routes|E].\n\n$game_concept_familial$ families keep [men_at_arms|E] to defend themselves, appoint their own [court_positions|E], and may move their estate to any city whose ruler will have them."
