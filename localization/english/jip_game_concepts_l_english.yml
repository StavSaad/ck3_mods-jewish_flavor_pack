 game_concept_familial_desc: "$game_concept_familial$ is a [government_form|E] in which the head of a landless family of a protected minority manages their [estate|E] and is subject to the local ruler who acts as their [liege|E]. Jewish families call it $game_concept_mishpacha$; the Sabians and Mandaeans of Iraq live the same way.\n\n$game_concept_familial$ characters have a personal [family_estate|E], which they can move to any [city|E] [holding|E]."
