l_english:
 game_concept_familial: "Familial"
 game_concept_familial_government: "Familial Government"
 game_concept_familial_governments: "Familial Governments"
 game_concept_familial_i: "@government_type_familial!"
 game_concept_familial_desc: "$game_concept_familial$ is a [government_form|E] in which the head of a landless family of a protected minority manages their [estate|E] and is subject to the local ruler who acts as their [liege|E]. Jewish families live this way across the realms of Christendom and Islam, and so do the Sabians and Mandaeans of Iraq.\n\n$game_concept_familial$ characters have a personal [family_estate|E], which they can move to any [city|E] [holding|E]."
