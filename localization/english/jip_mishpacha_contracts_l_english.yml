l_english:
 # Mishpacha contracts
 jip_mishpacha_contracts_group: "Family Business"
 jip_mishpacha_contract_busy_tt: "Already busy with a [task_contract|E] (two at once with a [GetPlayer.Custom('JipFamilyScribeName')])"
 jip_mishpacha_contract_invalidated_title: "Contract Fallen Through"
 jip_mishpacha_contract_invalidated_desc: "Circumstances have changed, and the [task_contract|E] can no longer be carried out. Any money put up for it has been returned."
 jip_mishpacha_contract_request_general: "Taken from the estate: a few months on you choose an approach, each testing one [skill|E] and with its own risks and rewards. The matching estate building and court position improve the odds."
 jip_mishpacha_contract_request_scheme: "Runs as a [contract_scheme|E]. You choose an approach when you take it, which sets the scheme's [skill|E], agents and pace; then execute the scheme when it is ready. The matching estate building and court position improve the odds."
 jip_contract_scheme_counting_house_tt: "Our Counting House"
 jip_contract_scheme_guest_room_tt: "Our Guest Room"
 jip_contract_scheme_yeshiva_tt: "Our [GetPlayer.Custom('JipFamilyLearningBranchName')]"
 jip_contract_scheme_parnas_tt: "Our [GetPlayer.Custom('JipFamilyAgentName')]"
 jip_contract_scheme_shaliach_tt: "Our [GetPlayer.Custom('JipFamilyEnvoyName')]"
 jip_contract_scheme_rosh_yeshiva_tt: "Our [GetPlayer.Custom('JipFamilyTeacherName')]"
 jip_contract_scheme_sofer_tt: "Our [GetPlayer.Custom('JipFamilyScribeName')]"
 task_contract_reward_effect_jip_contract_loan_forgiven_desc: "$label_success_standard$:"
 task_contract_reward_effect_jip_contract_ransom_paid_desc: "$label_success_standard$:"

 jip_contract_loan_contract: "Extend a Loan"
 jip_contract_loan_desc_title: "Silver for a ruler's need"
 jip_contract_loan_desc: "The [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] is short of coin, and the realm's lenders will not wait. [TaskContract.GetEmployer.GetSheHe|U] asks the family for #V [TaskContract.MakeScope.Var('jip_contract_stake').GetValue|0]#! [gold|E], to be repaid with interest."
 jip_contract_loan_request: "This [task_contract|E] lends #V [TaskContract.MakeScope.Var('jip_contract_stake').GetValue|0]#! [gold|E] up front. When it falls due, you press for repayment with [diplomacy|E], take goods in its place with [stewardship|E], call in the debtor's other debts with [intrigue|E], or forgive it for a [hook|E].\n\n$jip_mishpacha_contract_request_general$"
 jip_contract_loan_gold_tt: "Has the [gold|E] to lend"

 jip_contract_tolls_contract: "Farm the Tolls"
 jip_contract_tolls_desc_title: "The gates of the city"
 jip_contract_tolls_desc: "The [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] would rather sell the right to collect the city's tolls than chase the merchants [TaskContract.GetEmployer.GetHerselfHimself]. A family with good books and good clerks can turn a profit on it."
 jip_contract_tolls_request: "This [task_contract|E] is settled with [stewardship|E], [diplomacy|E] or [intrigue|E].\n\n$jip_mishpacha_contract_request_general$"

 jip_contract_caravan_contract: "Finance a Caravan"
 jip_contract_caravan_desc_title: "Silk, spices and paper"
 jip_contract_caravan_desc: "The [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] is sending a caravan east and seeks partners to share the cost and the risk. A share costs #V [TaskContract.MakeScope.Var('jip_contract_stake').GetValue|0]#! [gold|E]; a caravan that comes home can pay it back twice over."
 jip_contract_caravan_request: "This [task_contract|E] puts up #V [TaskContract.MakeScope.Var('jip_contract_stake').GetValue|0]#! [gold|E] up front. A safe route, a fast one, or help from the communities on the road: the approach sets the scheme's [skill|E], agents and pace. Radhanite families know the old roads.\n\n$jip_mishpacha_contract_request_scheme$"
 jip_contract_caravan_gold_tt: "Has the [gold|E] to buy a share"

 jip_contract_envoy_contract: "Act as Envoy"
 jip_contract_envoy_desc_title: "A go-between of no side"
 jip_contract_envoy_desc: "The [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] needs terms carried to [TaskContract.MakeScope.Var('jip_contract_target').Char.GetTitledFirstName], a ruler of another faith. A [GetPlayer.Custom('JipFaithfulOne')] is trusted by neither court, which is to say both can talk to one."
 jip_contract_envoy_request: "Argued with [diplomacy|E], [learning|E] or [intrigue|E], and gifts can help.\n\n$jip_mishpacha_contract_request_scheme$"

 jip_contract_ransom_contract: "Redeem the Captives"
 jip_contract_ransom_desc_title: "Pidyon Shevuyim"
 jip_contract_ransom_desc: "[TaskContract.MakeScope.Var('jip_contract_target').Char.GetFirstName], a [GetPlayer.Custom('JipFaithfulOne')], lies in the dungeon of the [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]. [GetPlayer.Custom('JipRansomDuty')], and the captor will take #V [TaskContract.MakeScope.Var('jip_contract_stake').GetValue|0]#! [gold|E] for [TaskContract.MakeScope.Var('jip_contract_target').Char.GetHerHim]."
 jip_contract_ransom_request: "Haggled with [diplomacy|E] or pleaded with [learning|E]; or pay the full price and free the captive at once. A good bargain costs half the price; the best costs nothing.\n\n$jip_mishpacha_contract_request_scheme$"
 jip_contract_ransom_gold_tt: "Has at least half the ransom in [gold|E]"

 jip_contract_physician_contract: "Serve as Court Physician"
 jip_contract_physician_desc_title: "In the tradition of [GetPlayer.Custom('JipPhysicianMaster')]"
 jip_contract_physician_desc: "[TaskContract.MakeScope.Var('jip_contract_target').Char.GetTitledFirstName] has fallen ill, and the court of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] has sent for a [GetPlayer.Custom('JipFaithfulAdj')] physician, as courts across the Mediterranean have done for generations."
 jip_contract_physician_request: "This [task_contract|E] is settled with [learning|E] or [stewardship|E]; a trained physician does better. Success treats the patient's illness.\n\n$jip_mishpacha_contract_request_general$"

 jip_contract_translate_contract: "Translate Texts"
 jip_contract_translate_desc_title: "[GetPlayer.Custom('JipTranslateRoad')]"
 jip_contract_translate_desc: "The [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] has come by a book [TaskContract.GetEmployer.GetSheHe] cannot read, and wants it in [TaskContract.GetEmployer.GetCulture.GetNameNoTooltip]. Few are better placed than a family whose letters cross every border."
 jip_contract_translate_request: "Rendered with [learning|E] or [diplomacy|E]; knowing the patron's language helps.\n\n$jip_mishpacha_contract_request_scheme$"

 jip_contract_responsum_contract: "Answer a Responsum"
 jip_contract_responsum_desc_title: "She'elot u-Teshuvot"
 jip_contract_responsum_desc: "[TaskContract.GetEmployer.GetTitledFirstName] has sent a question of law that the local scholars could not settle: a matter of marriage, of trade, of what may be eaten. The answer will be copied and read in communities far beyond [TaskContract.GetEmployer.GetHerHis] own."
 jip_contract_responsum_request: "This [task_contract|E] is settled with [learning|E] or [diplomacy|E]; an estate with a $jip_beit_din_03_domicile_building$ can put the question before its court.\n\n$jip_mishpacha_contract_request_general$"

 jip_contract_news_contract: "Gather News from Correspondents"
 jip_contract_news_desc_title: "Letters from every port"
 jip_contract_news_desc: "The [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] wants to know what [TaskContract.MakeScope.Var('jip_contract_target').Char.GetTitledFirstName] is planning. The family's correspondents write from every market and community, and read more than they are shown."
 jip_contract_horoscope_contract: "Cast a Horoscope"
 jip_contract_horoscope_desc_title: "The wisdom of Harran"
 jip_contract_horoscope_desc: "The [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] wants [TaskContract.GetEmployer.GetHerHis] horoscope cast by a Sabian of Harran, whose people read the heavens before there were caliphs to read them for."
 jip_contract_horoscope_request: "This [task_contract|E] is settled with [learning|E] or [diplomacy|E]; an [estate|E] with an Observatory reads the planets best. Sabian families only.\n\n$jip_mishpacha_contract_request_general$"
 jip_contract_news_request: "Gathered with [stewardship|E], [diplomacy|E] or [intrigue|E]. The best outcome turns up a [secret|E] of the rival; whether a failure gives the family away depends on whom you ask.\n\n$jip_mishpacha_contract_request_scheme$"

 # Events (generated by make_contract_events.py)
 jip_contract_accepted_tt: "Word will come in two to four months, when there is a choice to make"
 jip_contract_tests_stewardship_tt: "Tests your [stewardship|E]"
 jip_contract_tests_diplomacy_tt: "Tests your [diplomacy|E]"
 jip_contract_tests_learning_tt: "Tests your [learning|E]"
 jip_contract_tests_intrigue_tt: "Tests your [intrigue|E]"
 jip_contract_scheme_stewardship_tt: "Starts a [contract_scheme|E] that relies on your [stewardship|E]"
 jip_contract_scheme_diplomacy_tt: "Starts a [contract_scheme|E] that relies on your [diplomacy|E]"
 jip_contract_scheme_learning_tt: "Starts a [contract_scheme|E] that relies on your [learning|E]"
 jip_contract_scheme_intrigue_tt: "Starts a [contract_scheme|E] that relies on your [intrigue|E]"
 jip_contract_scheme_agents_success_tt: "Agents chosen for #P success#!"
 jip_contract_scheme_agents_balanced_tt: "A #P balanced#! choice of agents"
 jip_contract_scheme_agents_speed_tt: "Agents chosen for #P speed#!"
 jip_contract_outcome_critical_tt: "$label_success_critical$"
 jip_contract_outcome_success_tt: "$label_success_standard$"
 jip_contract_outcome_failure_tt: "$label_failure_standard$"

 jip_mishpacha_contract.0010.t: "The Debt Falls Due"
 jip_mishpacha_contract.0010.desc: "The term of the loan to [employer.GetTitledFirstName] has run out. [employer.GetSheHe|U] receives my letter graciously, speaks warmly of our friendship, and says nothing about the money.\n\nThe family's silver will not come home on its own."
 jip_mishpacha_contract.0010.a: "A courteous reminder, and then another"
 jip_mishpacha_contract.0010.a.tt: "Whatever comes of it, [employer.GetTitledFirstName] keeps a #P warmer opinion#! of the family"
 jip_mishpacha_contract.0010.b: "Rents and goods will do in place of coin"
 jip_mishpacha_contract.0010.b.tt: "#P Easier#!, and the goods sell on at a #P profit#!, but [employer.GetTitledFirstName] #N resents#! what is taken"
 jip_mishpacha_contract.0010.c: "Buy up [employer.GetHerHis] other debts, and call them all in"
 jip_mishpacha_contract.0010.c.tt: "On success, a #P hold#! over [employer.GetTitledFirstName]; on failure, #N an enemy#!"
 jip_mishpacha_contract.0010.d: "Forgive it. A ruler in our debt is worth more"
 jip_mishpacha_contract.0010.d.tt: "No repayment, but a #P favor#! owed"
 jip_mishpacha_contract.0012.t: "The Loan Is Made"
 jip_mishpacha_contract.0012.desc: "The silver has left the family's strongbox for [employer.GetTitledFirstName]'s treasury, against [employer.GetHerHis] seal and promise. The term runs some months; when it falls due, I will have to see that it comes home."
 jip_mishpacha_contract.0012.a: "It will be done"
 jip_mishpacha_contract.0011.courtesy: "I wrote as one friend to another, then again, and then a third time, each letter warmer than the last and each a little more pointed.\n\n"
 jip_mishpacha_contract.0011.goods: "Rather than wait for coin that may never come, I asked for the rents of a few villages and a share of the next harvest, to be sold on in the markets.\n\n"
 jip_mishpacha_contract.0011.pressure: "Quietly, the family bought up what [employer.GetTitledFirstName] owed to others, until there was no creditor left in the land but us.\n\n"
 jip_mishpacha_contract.0011.t.critical: "The family's word is its credit"
 jip_mishpacha_contract.0011.critical: "Every coin came back, with interest and an apology, and [employer.GetTitledFirstName] spoke of the family to [employer.GetHerHis] whole court."
 jip_mishpacha_contract.0011.t.success: "Paid in full"
 jip_mishpacha_contract.0011.success: "The debt was paid at last, with the interest agreed. Not a coin more."
 jip_mishpacha_contract.0011.t.failure: "Half is better than nothing"
 jip_mishpacha_contract.0011.failure: "In the end [employer.GetTitledFirstName] paid back what [employer.GetSheHe] could, which was half, and swore that the rest was the fault of the times."
 jip_mishpacha_contract.0011.critical.a: "Better than I hoped"
 jip_mishpacha_contract.0011.success.a: "It is done"
 jip_mishpacha_contract.0011.failure.a: "We will do better next time"

 jip_mishpacha_contract.0020.t: "The Season's Tolls"
 jip_mishpacha_contract.0020.desc: "The caravans have come and gone through the gates of [employer.GetPrimaryTitle.GetNameNoTier], and the family's clerks have stood at every one. Now the reckoning: what was taken, what [employer.GetTitledFirstName] is owed, and what is left for us."
 jip_mishpacha_contract.0020.a: "Strict ledgers at every gate"
 jip_mishpacha_contract.0020.a.tt: "On success, a #P larger take#!"
 jip_mishpacha_contract.0020.b: "Go easy on the merchants, and they will come back"
 jip_mishpacha_contract.0020.b.tt: "#P Easier#! and wins #P prestige#! and [employer.GetTitledFirstName]'s #P favor#!, but a #N smaller take#!"
 jip_mishpacha_contract.0020.c: "The books need not record everything"
 jip_mishpacha_contract.0020.c.tt: "#P Easier#!, and on success #P twice the take#!; on failure, a #N scandal#!"
 jip_mishpacha_contract.0022.t: "The Gates Are Ours"
 jip_mishpacha_contract.0022.desc: "[employer.GetTitledFirstName] has given the family the farm of [employer.GetHerHis] tolls for the season. The clerks are on their way to the gates; when the caravans have passed, there will be a reckoning to make."
 jip_mishpacha_contract.0022.a: "It will be done"
 jip_mishpacha_contract.0021.strict: "I had every bale weighed and every coin entered twice. The merchants grumbled, and paid.\n\n"
 jip_mishpacha_contract.0021.lenient: "I let the small traders through for a token and kept the gates moving. Word spread that the tolls of [employer.GetPrimaryTitle.GetNameNoTier] were fair.\n\n"
 jip_mishpacha_contract.0021.books: "Two sets of books, and the clerks who kept them well paid for their silence.\n\n"
 jip_mishpacha_contract.0021.t.critical: "A season to remember"
 jip_mishpacha_contract.0021.critical: "The season was the best the city had seen in years, and [employer.GetTitledFirstName] was so pleased with [employer.GetHerHis] share that [employer.GetSheHe] never asked to see the family's."
 jip_mishpacha_contract.0021.t.success: "A fair season's work"
 jip_mishpacha_contract.0021.success: "The tolls were gathered, [employer.GetTitledFirstName] was paid, and the family kept its share."
 jip_mishpacha_contract.0021.t.failure: "The gates were not kind to us"
 jip_mishpacha_contract.0021.failure: "The take fell short. Merchants took other roads, clerks went missing, and [employer.GetTitledFirstName] wants to know where [employer.GetHerHis] money went."
 jip_mishpacha_contract.0021.critical.a: "Better than I hoped"
 jip_mishpacha_contract.0021.success.a: "It is done"
 jip_mishpacha_contract.0021.failure.a: "We will do better next time"

 jip_mishpacha_contract.0030.t: "Fitting Out the Caravan"
 jip_mishpacha_contract.0030.desc: "The caravan of [employer.GetTitledFirstName] is being fitted out for the eastern markets, and the family's share is aboard. The roads are long: storms, bandits, a toll-keeper with a new idea. How it travels, and who goes with it, is ours to decide."
 jip_mishpacha_contract.0030.a: "Spread the cargo over many beasts and many hands"
 jip_mishpacha_contract.0030.a.tt: "#P Safer#! but #N slower#!, and a #N smaller return#!"
 jip_mishpacha_contract.0030.b: "Write ahead to the communities along the road"
 jip_mishpacha_contract.0030.b.tt: "On success, the communities' thanks bring #P piety#!"
 jip_mishpacha_contract.0030.c: "Send it across the desert, the short way"
 jip_mishpacha_contract.0030.c.tt: "#P Faster#! but #N riskier#!, and on success a #P much larger return#!"
 jip_mishpacha_contract.0030.d: "Send it by the old Radhanite roads"
 jip_mishpacha_contract.0030.d.tt: "The Radhanites know these roads #P better than anyone#!"
 jip_mishpacha_contract.0031.spread: "I had the family's share split among a dozen traders, so that no one loss could ruin us.\n\n"
 jip_mishpacha_contract.0031.communities: "Letters went ahead to every Jewish community on the road, asking them to shelter the caravan, feed its beasts and warn it of trouble.\n\n"
 jip_mishpacha_contract.0031.desert: "I sent word to turn the caravan off the long road and across the desert, where there are no tolls and few wells.\n\n"
 jip_mishpacha_contract.0031.radhanite: "The old Radhanite roads are known to few but our own people, and the caravan took them from well to well and from community to community.\n\n"
 jip_mishpacha_contract.0031.t.critical: "Twice over"
 jip_mishpacha_contract.0031.critical: "The caravan came home heavy with silk, pepper and paper, and the family's share sold for twice what it cost."
 jip_mishpacha_contract.0031.t.success: "A profitable venture"
 jip_mishpacha_contract.0031.success: "The caravan came home late and footsore, but whole, and the family's share sold at a good price."
 jip_mishpacha_contract.0031.t.failure: "The road took its toll"
 jip_mishpacha_contract.0031.failure: "Of the caravan, a few beasts and fewer men came home. What was saved barely covers a quarter of the family's share."
 jip_mishpacha_contract.0031.critical.a: "Better than I hoped"
 jip_mishpacha_contract.0031.success.a: "It is done"
 jip_mishpacha_contract.0031.failure.a: "We will do better next time"

 jip_mishpacha_contract.0040.t: "Carrying the Terms"
 jip_mishpacha_contract.0040.desc: "[employer.GetTitledFirstName] has given the family terms to carry to [jip_contract_target.GetTitledFirstName], a ruler of another faith who will trust them no more than [jip_contract_target.GetSheHe] trusts [employer.GetTitledFirstName].\n\nHow they are carried, and how they are argued, is up to us."
 jip_mishpacha_contract.0040.a: "Argue the terms point by point"
 jip_mishpacha_contract.0040.a.tt: "A plain negotiation, without side effects"
 jip_mishpacha_contract.0040.b: "Cite the treaties and the law of nations"
 jip_mishpacha_contract.0040.b.tt: "On success, #P prestige#! for the family's learning; on failure, [jip_contract_target.GetTitledFirstName] feels #N lectured#!"
 jip_mishpacha_contract.0040.c: "Sweeten the letters with gifts"
 jip_mishpacha_contract.0040.c.tt: "#P Much easier#!, at a #N cost#! in gold"
 jip_mishpacha_contract.0040.d: "Hint at what each court would rather the other did not know"
 jip_mishpacha_contract.0040.d.tt: "#N Harder#!; on success, a #P hold#! over [jip_contract_target.GetTitledFirstName]; on failure, #N both courts#! distrust the family"
 jip_mishpacha_contract.0041.argue: "I went through the terms clause by clause, conceding the small points to win the large ones.\n\n"
 jip_mishpacha_contract.0041.law: "I laid out the old treaties between the two realms, and what the scholars of both faiths have written on keeping faith with neighbours.\n\n"
 jip_mishpacha_contract.0041.gifts: "The terms arrived with a gift for [jip_contract_target.GetTitledFirstName]: fine cloth, a book, and a horse worth more than the messenger.\n\n"
 jip_mishpacha_contract.0041.leverage: "Between the clauses I let it be known that the family hears a great deal, from both courts, and could be persuaded to forget some of it.\n\n"
 jip_mishpacha_contract.0041.t.critical: "Peace made, and friends of both"
 jip_mishpacha_contract.0041.critical: "Both sides signed, both thanked the family, and [jip_contract_target.GetTitledFirstName] asked whether we might carry [jip_contract_target.GetHerHis] letters too."
 jip_mishpacha_contract.0041.t.success: "The terms are agreed"
 jip_mishpacha_contract.0041.success: "The terms were accepted, with a few changes that [employer.GetTitledFirstName] can live with."
 jip_mishpacha_contract.0041.t.failure: "No agreement"
 jip_mishpacha_contract.0041.failure: "[jip_contract_target.GetTitledFirstName] tore up the terms, and [employer.GetTitledFirstName] blames the messenger."
 jip_mishpacha_contract.0041.critical.a: "Better than I hoped"
 jip_mishpacha_contract.0041.success.a: "It is done"
 jip_mishpacha_contract.0041.failure.a: "We will do better next time"

 jip_mishpacha_contract.0050.t: "The Price of a Captive"
 jip_mishpacha_contract.0050.desc: "[employer.GetTitledFirstName] has named the price of [jip_contract_target.GetFirstName]'s freedom, and named it high, knowing that [ROOT.Char.Custom('JipFaithfulMany')] will pay for their own. [ROOT.Char.Custom('JipRansomWarning')]\n\nAnd yet [jip_contract_target.GetSheHe] is still in the dark."
 jip_mishpacha_contract.0050.a: "Haggle the price down"
 jip_mishpacha_contract.0050.a.tt: "A plain bargain: half the price on success, nothing on the best outcome"
 jip_mishpacha_contract.0050.b: "Appeal to the captor's mercy and to [employer.GetHerHis] own faith"
 jip_mishpacha_contract.0050.b.tt: "#P Easier#!; on success, extra #P piety#!; on failure, [employer.GetTitledFirstName] is #N insulted#!"
 jip_mishpacha_contract.0050.c: "Pay what is asked. A life is not for bargaining"
 jip_mishpacha_contract.0050.c.tt: "The captive goes free #P for certain#!, at the #N full price#!"
 jip_mishpacha_contract.0051.haggle: "I haggled as if over a bale of cloth, as [ROOT.Char.Custom('JipFaithTeachers')] advise, so that the captor would not think a [ROOT.Char.Custom('JipFaithfulOne')]'s life worth a fortune.\n\n"
 jip_mishpacha_contract.0051.mercy: "I reminded [employer.GetTitledFirstName] what [employer.GetHerHis] own scriptures say of mercy to the prisoner, and of the reward that awaits it.\n\n"
 jip_mishpacha_contract.0051.t.critical: "Redeemed"
 jip_mishpacha_contract.0051.critical: "[employer.GetTitledFirstName] let [jip_contract_target.GetFirstName] go for nothing at all, and [jip_contract_target.GetSheHe] wept at our door."
 jip_mishpacha_contract.0051.t.success: "Redeemed, at a price"
 jip_mishpacha_contract.0051.success: "A price was agreed, half of what was asked, and [jip_contract_target.GetFirstName] walked out into the light."
 jip_mishpacha_contract.0051.t.failure: "We could not free them"
 jip_mishpacha_contract.0051.failure: "[employer.GetTitledFirstName] would not move, and [jip_contract_target.GetFirstName] remains in the dark."
 jip_mishpacha_contract.0051.critical.a: "Better than I hoped"
 jip_mishpacha_contract.0051.success.a: "It is done"
 jip_mishpacha_contract.0051.failure.a: "We will do better next time"

 jip_mishpacha_contract.0060.t: "At the Bedside"
 jip_mishpacha_contract.0060.desc: "[jip_contract_target.GetTitledFirstName] lies pale and feverish, while the court physicians argue over bleeding and the priests over prayers. They make way, not gladly, for the [ROOT.Char.Custom('JipFaithfulOne')]."
 jip_mishpacha_contract.0060.a: "Treat by Hippocrates and Galen"
 jip_mishpacha_contract.0060.a.tt: "The learned course, without side effects"
 jip_mishpacha_contract.0060.b: "Order the household: diet, rest and clean air"
 jip_mishpacha_contract.0060.b.tt: "#P Safer#!, but a #N smaller fee#!"
 jip_mishpacha_contract.0060.c: "Try a bold remedy the court physicians would not dare"
 jip_mishpacha_contract.0060.c.tt: "#N Riskier#!; on success, a #P large fee#! and #P prestige#!; on failure, the patient is #N worse#!"
 jip_mishpacha_contract.0060.d: "Trust my own practised hand"
 jip_mishpacha_contract.0060.d.tt: "A trained physician does #P much better#!"
 jip_mishpacha_contract.0062.t: "Summoned to the Sickbed"
 jip_mishpacha_contract.0062.desc: "Word has gone to [employer.GetTitledFirstName] that the family will tend [jip_contract_target.GetTitledFirstName]. The road, and the court's own physicians, will take some time to get past; when I reach the bedside, I will have to choose how to treat [jip_contract_target.GetHerHim]."
 jip_mishpacha_contract.0062.a: "It will be done"
 jip_mishpacha_contract.0061.galen: "I treated by the books of Hippocrates and Galen: the humours weighed, the pulse taken morning and night, the remedies measured to the grain.\n\n"
 jip_mishpacha_contract.0061.regimen: "As [ROOT.Char.Custom('JipPhysicianMaster')] taught, I began with the household: plain food, clean water, open windows and quiet, and no more bleeding.\n\n"
 jip_mishpacha_contract.0061.bold: "I gave a remedy from the Arabic books that the court physicians had never seen, and would not have dared.\n\n"
 jip_mishpacha_contract.0061.own_hand: "I have treated this illness before, and I treated it again.\n\n"
 jip_mishpacha_contract.0061.t.critical: "A remarkable recovery"
 jip_mishpacha_contract.0061.critical: "Within a week [jip_contract_target.GetFirstName] was sitting up and asking for food, and the court physicians were asking for my books."
 jip_mishpacha_contract.0061.t.success: "On the mend"
 jip_mishpacha_contract.0061.success: "The fever broke slowly, and [jip_contract_target.GetFirstName] is on the mend."
 jip_mishpacha_contract.0061.t.failure: "Beyond my skill"
 jip_mishpacha_contract.0061.failure: "Nothing I did seemed to help, and [employer.GetTitledFirstName] has sent for other physicians."
 jip_mishpacha_contract.0061.critical.a: "Better than I hoped"
 jip_mishpacha_contract.0061.success.a: "It is done"
 jip_mishpacha_contract.0061.failure.a: "We will do better next time"

 jip_mishpacha_contract.0070.t: "A Book to Render"
 jip_mishpacha_contract.0070.desc: "The book from [employer.GetTitledFirstName] lies open on the table, its margins crowded with notes. Some words have no equal in [employer.GetCulture.GetNameNoTooltip], and the meaning of the whole may hang on how they are rendered."
 jip_mishpacha_contract.0070.a: "Word for word, as the author wrote it"
 jip_mishpacha_contract.0070.a.tt: "On success, a faithful text brings #P piety#!"
 jip_mishpacha_contract.0070.b: "Rendered to please the ear of the court"
 jip_mishpacha_contract.0070.b.tt: "On success, [employer.GetTitledFirstName] is #P delighted#!"
 jip_mishpacha_contract.0070.c: "Add a commentary of our own"
 jip_mishpacha_contract.0070.c.tt: "#N Harder#!; on success, the family's name is made (#P prestige#!, #P renown#!); on failure, #N mocked#!"
 jip_mishpacha_contract.0070.d: "I know the patron's tongue well enough to do it justice"
 jip_mishpacha_contract.0070.d.tt: "Knowing [employer.GetCulture.GetNameNoTooltip] makes it #P much easier#!"
 jip_mishpacha_contract.0071.literal: "I rendered it word for word, as faithfully as the two tongues allow, and let the reader do the rest.\n\n"
 jip_mishpacha_contract.0071.courtly: "I rendered it as a poet would, smoothing the hard passages and flattering the patron where the author allowed.\n\n"
 jip_mishpacha_contract.0071.commentary: "I added a commentary of my own, explaining the hard passages and answering the author where I thought him wrong.\n\n"
 jip_mishpacha_contract.0071.language: "I know [employer.GetCulture.GetNameNoTooltip] as well as I know [ROOT.Char.Custom('JipFaithTongue')], and it shows on every page.\n\n"
 jip_mishpacha_contract.0071.t.critical: "A book for the ages"
 jip_mishpacha_contract.0071.critical: "[employer.GetTitledFirstName] had the translation copied for every scholar at court, and the family's name on every copy."
 jip_mishpacha_contract.0071.t.success: "The work is delivered"
 jip_mishpacha_contract.0071.success: "[employer.GetTitledFirstName] has the book [employer.GetSheHe] wanted, and has paid for it."
 jip_mishpacha_contract.0071.t.failure: "A poor translation"
 jip_mishpacha_contract.0071.failure: "[employer.GetTitledFirstName]'s scholars found errors on the first page, and more on the second."
 jip_mishpacha_contract.0071.critical.a: "Better than I hoped"
 jip_mishpacha_contract.0071.success.a: "It is done"
 jip_mishpacha_contract.0071.failure.a: "We will do better next time"

 jip_mishpacha_contract.0080.t: "A Question of Law"
 jip_mishpacha_contract.0080.desc: "The question from [employer.GetTitledFirstName] has been read and read again. The sources disagree, the local custom is unclear, and whatever answer goes back will be copied and cited for years."
 jip_mishpacha_contract.0080.a: "Rule strictly, by the letter of the law"
 jip_mishpacha_contract.0080.a.tt: "On success, extra #P piety#!; [employer.GetTitledFirstName] is #N displeased#! either way"
 jip_mishpacha_contract.0080.b: "Rule leniently, for the sake of peace in the community"
 jip_mishpacha_contract.0080.b.tt: "#P Easier#!, and on success [employer.GetTitledFirstName] is #P grateful#!, but #N less piety#!"
 jip_mishpacha_contract.0080.c: "Put it before our Beit Din"
 jip_mishpacha_contract.0080.c.tt: "A ruling of the family's court is #P much likelier#! to stand, and adds to its #P renown#!"
 jip_mishpacha_contract.0082.t: "A Question Received"
 jip_mishpacha_contract.0082.desc: "[employer.GetTitledFirstName]'s question has come, sealed, with a gift for the trouble. It will need the sources and some months of study; when the answer is ready to write, I will have to decide what it says."
 jip_mishpacha_contract.0082.a: "It will be done"
 jip_mishpacha_contract.0081.strict: "I ruled by the letter of the law, as the sources most plainly read, whatever it costs the asker.\n\n"
 jip_mishpacha_contract.0081.lenient: "I found the lenient reading, as the House of Hillel would, for the sake of peace in the community.\n\n"
 jip_mishpacha_contract.0081.beit_din: "I put the question before the judges of our own Beit Din, and sent their ruling under all three seals.\n\n"
 jip_mishpacha_contract.0081.t.critical: "Cited far and wide"
 jip_mishpacha_contract.0081.critical: "The responsum is already being copied in other cities, and scholars cite it by the family's name."
 jip_mishpacha_contract.0081.t.success: "The question is settled"
 jip_mishpacha_contract.0081.success: "The answer was received and accepted, and [employer.GetTitledFirstName] has sent thanks."
 jip_mishpacha_contract.0081.t.failure: "A disputed ruling"
 jip_mishpacha_contract.0081.failure: "Other scholars have written to dispute the ruling, and [employer.GetTitledFirstName] is left more confused than before."
 jip_mishpacha_contract.0081.critical.a: "Better than I hoped"
 jip_mishpacha_contract.0081.success.a: "It is done"
 jip_mishpacha_contract.0081.failure.a: "We will do better next time"

 jip_mishpacha_contract.0090.t: "Whom to Ask"
 jip_mishpacha_contract.0090.desc: "[employer.GetTitledFirstName] wants to know what [jip_contract_target.GetTitledFirstName] is planning. The family's correspondents write from every market and community, and read more than they are shown. The question is whom to ask."
 jip_mishpacha_contract.0090.a: "Ask the merchants who trade at the rival's court"
 jip_mishpacha_contract.0090.a.tt: "On success, the merchants' gossip sells for #P extra gold#!; on failure, [jip_contract_target.GetTitledFirstName] #N learns who asked#!"
 jip_mishpacha_contract.0090.b: "Ask the [ROOT.Char.Custom('JipFaithfulMany')] of the rival's realm"
 jip_mishpacha_contract.0090.b.tt: "They will #P never give the family away#!, whatever comes of it"
 jip_mishpacha_contract.0090.c: "Pay a clerk to copy the rival's letters"
 jip_mishpacha_contract.0090.c.tt: "#P Easier#!, at a #N cost#! in gold; on failure, a #N scandal#!"
 jip_mishpacha_contract.0091.merchants: "I asked the merchants who sell at [jip_contract_target.GetTitledFirstName]'s court what they had seen and heard, and paid for the answers.\n\n"
 jip_mishpacha_contract.0091.communities: "I wrote to the [ROOT.Char.Custom('JipFaithfulMany')] of [jip_contract_target.GetTitledFirstName]'s realm, who see much and are asked little.\n\n"
 jip_mishpacha_contract.0091.clerk: "A clerk in [jip_contract_target.GetTitledFirstName]'s chancery was paid to copy what crossed his desk.\n\n"
 jip_mishpacha_contract.0091.t.critical: "More than we were asked for"
 jip_mishpacha_contract.0091.critical: "The letters told [employer.GetTitledFirstName] everything [employer.GetSheHe] wanted, and the family something more besides."
 jip_mishpacha_contract.0091.t.success: "The news is delivered"
 jip_mishpacha_contract.0091.success: "[employer.GetTitledFirstName] has the news [employer.GetSheHe] wanted, and has paid for it."
 jip_mishpacha_contract.0091.t.failure: "Nothing worth knowing"
 jip_mishpacha_contract.0091.failure: "The letters held nothing of use, and [employer.GetTitledFirstName] has paid for nothing."
 jip_mishpacha_contract.0091.critical.a: "Better than I hoped"
 jip_mishpacha_contract.0091.success.a: "It is done"
 jip_mishpacha_contract.0091.failure.a: "We will do better next time"

 jip_mishpacha_contract.0100.t: "What the Stars Foretell"
 jip_mishpacha_contract.0100.desc: "[employer.GetTitledFirstName] wants [employer.GetHerHis] horoscope cast: the hour of [employer.GetHerHis] birth, the houses of the planets, the conjunctions of the years to come. The court astrologers have already given one answer; [employer.GetSheHe] wants a Harranian's.\n\nThe heavens say what they say. What [employer.GetSheHe] hears is another matter."
 jip_mishpacha_contract.0100.a: "Cast it from the tables, line by line"
 jip_mishpacha_contract.0100.a.tt: "The learned course, without side effects"
 jip_mishpacha_contract.0100.b: "Read the stars as [employer.GetSheHe] would wish them read"
 jip_mishpacha_contract.0100.b.tt: "#P Easier#!, and [employer.GetTitledFirstName] is #P pleased#!, but it wins the family #N no renown#!"
 jip_mishpacha_contract.0100.c: "Tell [employer.GetHerHim] what the stars truly say, however dark"
 jip_mishpacha_contract.0100.c.tt: "#N Riskier#!; on success, #P prestige#! and a #P larger fee#!; on failure, [employer.GetTitledFirstName] is #N offended#!"
 jip_mishpacha_contract.0100.d: "Take the planets' places from our own Observatory"
 jip_mishpacha_contract.0100.d.tt: "An Observatory of our own does #P much better#!"
 jip_mishpacha_contract.0102.t: "The Hour of Birth"
 jip_mishpacha_contract.0102.desc: "[employer.GetTitledFirstName] has sent the hour and place of [employer.GetHerHis] birth. The tables must be worked through and the planets followed across the years to come; in a few months the chart will be ready to read, and I will have to decide what to tell [employer.GetHerHim]."
 jip_mishpacha_contract.0102.a: "It will be done"
 jip_mishpacha_contract.0101.tables: "I worked from the tables of the Zij, the ascendant and the twelve houses, and set down only what the reckoning gave.\n\n"
 jip_mishpacha_contract.0101.flatter: "I found in the heavens long life, victory and many sons, as the court had hoped, and kept the darker aspects to myself.\n\n"
 jip_mishpacha_contract.0101.warn: "Mars stood ill in the house of enemies, and I said so plainly, with the years and the remedies.\n\n"
 jip_mishpacha_contract.0101.observatory: "I had the planets' places taken that very night from the family's Observatory, rather than trusting old tables.\n\n"
 jip_mishpacha_contract.0101.t.critical: "Written in the stars"
 jip_mishpacha_contract.0101.critical: "[employer.GetTitledFirstName] keeps the horoscope by [employer.GetHerHis] bed, and the court astrologers have asked how it was done."
 jip_mishpacha_contract.0101.t.success: "The horoscope is cast"
 jip_mishpacha_contract.0101.success: "[employer.GetTitledFirstName] has the horoscope [employer.GetSheHe] wanted, and has paid for it."
 jip_mishpacha_contract.0101.t.failure: "Clouded heavens"
 jip_mishpacha_contract.0101.failure: "[employer.GetTitledFirstName] found the horoscope muddled and its predictions wrong, and has said so to the whole court."
 jip_mishpacha_contract.0101.critical.a: "Better than I hoped"
 jip_mishpacha_contract.0101.success.a: "It is done"
 jip_mishpacha_contract.0101.failure.a: "We will do better next time"

