l_english:
 # Jewish court positions (jip_jewish_court_positions.txt)
 jip_rosh_yeshiva_court_position: "Rosh Yeshiva"
 jip_rosh_yeshiva_court_position_desc: "The $jip_rosh_yeshiva_court_position$ heads the family's academy, where the young of the house and its dependants study the Torah and the Talmud, and from which its scholars and judges come."
 jip_av_beit_din_court_position: "Av Beit Din"
 jip_av_beit_din_court_position_desc: "The $jip_av_beit_din_court_position$ presides over the rabbinic court, judging disputes between Jews by the halakha and lending the authority of the law to the one who appointed them."
 jip_paytan_court_position: "Paytan"
 jip_paytan_court_position_desc: "The $jip_paytan_court_position$ writes piyyutim, the Hebrew liturgical poems sung in the synagogue, and verses in praise of their patron, in the tradition of Ibn Gabirol and Yehuda Halevi."
 jip_chazan_court_position: "Chazan"
 jip_chazan_court_position_desc: "The $jip_chazan_court_position$ leads the family and its congregation in prayer, chanting the liturgy on the Sabbath and the festivals."
 jip_gabbai_tzedakah_court_position: "Gabbai Tzedakah"
 jip_gabbai_tzedakah_court_position_desc: "The $jip_gabbai_tzedakah_court_position$ collects the family's charity and hands it out to the poor, the sick, and captives awaiting ransom, as the law requires."
 jip_shaliach_court_position: "Shaliach"
 jip_shaliach_court_position_desc: "The $jip_shaliach_court_position$ travels between the Jewish communities, carrying letters, funds and news, and binding them to the house they serve."
 jip_sofer_court_position: "Sofer"
 jip_sofer_court_position_desc: "The $jip_sofer_court_position$ keeps the family's letters, contracts and accounts, drawing up its deeds and its dealings with the courts of the gentiles."
 jip_parnas_court_position: "Parnas"
 jip_parnas_court_position_desc: "The $jip_parnas_court_position$ leads the community where the family's estate lies, apportioning its taxes and collecting its dues."

 # Aptitude reasons
 court_position_jip_yeshiva: "The family's $jip_yeshiva_03_domicile_building$"
 court_position_jip_beit_din: "The family's $jip_beit_din_03_domicile_building$"
 court_position_jip_beit_knesset: "The family's $jip_beit_knesset_04_domicile_building$"
 court_position_jip_employer_counting_house: "The family's $jip_counting_house_03_domicile_building$"
 court_position_jip_cynical_trait: "[GetTrait('cynical').GetName( ROOT.Char )]"

 # Tasks (jip_jewish_court_position_tasks.txt)
 jip_rosh_yeshiva_train_disciples: "Train Disciples"
 jip_rosh_yeshiva_train_disciples_desc: "This character teaches the Talmud to the Jewish members of your court, raising scholars for the family."
 jip_rosh_yeshiva_train_disciples_tt: "Each year, a Jewish courtier may gain [learning|E], more likely the better the [aptitude|E]"
 jip_rosh_yeshiva_train_disciples_toast: "A Disciple of the Yeshiva"
 jip_av_beit_din_judge_community: "Judge the Community"
 jip_av_beit_din_judge_community_desc: "This character judges the community's disputes in your name, upholding your authority and the family's good name."
 jip_av_beit_din_issue_responsa: "Issue Responsa"
 jip_av_beit_din_issue_responsa_desc: "This character answers questions of law sent by distant communities, spreading the renown of your house."
 jip_gabbai_tzedakah_ransom_captives: "Ransom Captives"
 jip_gabbai_tzedakah_ransom_captives_desc: "This character gathers funds to redeem Jews held captive by other rulers, as the law commands: pidyon shvuyim."
 jip_gabbai_tzedakah_ransom_captives_tt: "Each year, a Jew imprisoned by another ruler may be ransomed and freed, more likely the better the [aptitude|E]"
 jip_gabbai_tzedakah_ransom_captives_toast: "A Captive Redeemed"
 jip_shaliach_gather_donations: "Gather Donations"
 jip_shaliach_gather_donations_desc: "This character travels between the communities of the diaspora, collecting their donations for your house."
 jip_shaliach_bind_communities: "Bind the Communities"
 jip_shaliach_bind_communities_desc: "This character carries your letters to the Jewish communities and rulers abroad, binding them to your house."
 jip_sofer_keep_estate: "Keep the Estate's Affairs"
 jip_sofer_keep_estate_desc: "This character keeps the accounts and contracts of your [domicile|E], so its building goes faster and cheaper."
 jip_parnas_collect_dues: "Collect Dues"
 jip_parnas_collect_dues_desc: "This character collects the community's dues and apportions its taxes, much of it finding its way to your [domicile|E]."
 jip_parnas_petition_authorities: "Petition the Authorities"
 jip_parnas_petition_authorities_desc: "This character speaks for the community before your [liege|E], seeking their goodwill and protection."
 jip_parnas_petition_authorities_tt: "An AI [liege|E] is less likely to expel the Jews while this task lasts"
