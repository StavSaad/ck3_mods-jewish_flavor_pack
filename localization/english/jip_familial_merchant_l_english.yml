l_english:
 jip_familial_found_company_decision: "Found a Merchant Company"
 jip_familial_found_company_decision_desc: "Our estate already keeps the books of half the city's trade. Why should we not put our name to a [company|E] of our own, and trade under it from one end of the world to the other?"
 jip_familial_found_company_decision_tooltip: "Turn your family into a [merchant|E] [company|E] in your [estate|E]'s city"
 jip_familial_found_company_decision_confirm: "Open the counting house to the world"
 jip_familial_found_company_decision_effect_tt: "Your family becomes a [merchant|E] [company|E] in your [estate|E]'s city, with that city's lord as your patron. Your family title, your estate and its buildings and your [task_contracts|E] are left behind"
 jip_familial_found_company_only_family_title_tt: "You hold no [title|E] but your family's own"
 jip_familial_found_company_estate_tt: "Your family has an [estate|E]"

 jip_merchant_become_familial_decision: "Become a $game_concept_familial$ House"
 jip_merchant_become_familial_decision_desc: "Caravans come and go, and so do patrons and the roads. But a house that lives among its own people, keeps their law and speaks for them at court, endures. Let the company be wound up or the camp struck, and let our house settle among its own."
 jip_merchant_become_familial_decision_tooltip: "Wind up your [company|E] or break up your camp, and become a $game_concept_familial$ family"
 jip_merchant_become_familial_decision_confirm: "Settle the house"
 jip_merchant_become_familial_decision_effect_tt: "Your [company|E] is wound up and your house becomes a [familial|E] family in its city, with a family title and an [estate|E], under that city's lord as patron. Your company's charter and the loans you have given are left behind"
 jip_adventurer_become_familial_decision_effect_tt: "Your camp is broken up, its buildings sold off, and your house becomes a [familial|E] family with a family title and an [estate|E] in a city of the camp's county, or the nearest city that will take you, under that city's lord as patron. Your camp officers and followers stay with you as courtiers; your provisions and your [task_contracts|E] are left behind"
 jip_merchant_become_familial_company_tt: "You have a [company|E] or a camp"
 jip_merchant_become_familial_expelled_tt: "The Jews have not been expelled from the realm your [company|E] or camp lies in"

 jip_familial.0001.t: "A House Among Its Own"
 jip_familial.0001.desc: "The road has been long, and the camp has followed it from one lord's gates to the next. But in every city there is a street where [ROOT.Char.Custom('JipFaithfulOne')]s live, a house of study and a court of our own law, and a lord who would take a family under his protection for the taxes it pays.\n\nWe could strike the camp and settle among our own. Or we could keep to the road a while yet."
 jip_familial.0001.a: "Strike the camp and settle the house"
 jip_familial.0001.b: "The road is not done with us"
 jip_familial.0001.b.tt: "You stay an adventurer. You can still take the decision $jip_merchant_become_familial_decision$ later"
