l_english:
 # Arameanism (aramean_pagan, jip_canaanite_faith_types.txt) and its rites (0.15 plan, section 14)
 aramean_pagan: "Arameanism"
 aramean_pagan_adj: "Aramean"
 aramean_pagan_adherent: "Aramean pagan"
 aramean_pagan_adherent_plural: "Aramean pagans"
 aramean_pagan_desc: "The gods of Aram ruled the cities of Syria long before the Greeks came: Hadad of the storm, who rides the bull with the thunderbolt in his hand, Atargatis of the sacred lake, El the father, and the Fortunes of the cities. Their kings called themselves Hadad's sons, and their temples at Damascus, Palmyra and Manbij drew pilgrims from the whole East."

 hadadism: "Hadadism"
 hadadism_adj: "Hadadite"
 hadadism_adherent: "Hadadite"
 hadadism_adherent_plural: "Hadadites"
 hadadism_desc: "The rite of Hadad, lord of the storm and of the kings of Damascus and Aleppo, whose rain feeds the fields at the desert's edge, with Atargatis his consort beside him."

 belism: "Belism"
 belism_adj: "Belite"
 belism_adherent: "Belite"
 belism_adherent_plural: "Belites"
 belism_desc: "The rite of Palmyra: Bel, Lord of the Gods, enthroned between Yarhibol of the sun and Aglibol of the moon, with Baalshamin, Malakbel and Allat. The caravan masters feast in his priests' brotherhoods and read the year in the stars."

 atargatism: "Atargatism"
 atargatism_adj: "Atargatean"
 atargatism_adherent: "Atargatean"
 atargatism_adherent_plural: "Atargateans"
 atargatism_desc: "The rite of the Syrian Goddess of Manbij, whose sacred lake teems with fish that no one may eat. Her priests, the Galli, carry her image through the cities, and every spring the pilgrims come to burn the Pyre in her court."

