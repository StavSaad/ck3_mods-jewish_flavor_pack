l_english:
 # Names for new rites of Mesopotamianism and Baalism (common/religion/rite_names/00_jip_rite_names.txt)
 jip_rite_name_marduk: "Mardukism"
 jip_rite_name_marduk_adj: "Mardukite"
 jip_rite_name_marduk_adherent: "Mardukite"
 jip_rite_name_marduk_adherent_plural: "Mardukites"
 jip_rite_name_marduk_desc: "Marduk slew Tiamat and made the world from her body; his statue stands in Esagila at Babylon, and the king who takes his hands at the New Year rules with the gods' consent."
 jip_rite_name_bel: "Belism"
 jip_rite_name_bel_adj: "Belite"
 jip_rite_name_bel_adherent: "Belite"
 jip_rite_name_bel_adherent_plural: "Belites"
 jip_rite_name_bel_desc: "The Palmyrenes honour Bel above all, with Yarhibol of the spring and Aglibol of the moon beside him, in the great temple that rises over the caravan city."
 jip_rite_name_hadad: "Hadadism"
 jip_rite_name_hadad_adj: "Hadadite"
 jip_rite_name_hadad_adherent: "Hadadite"
 jip_rite_name_hadad_adherent_plural: "Hadadites"
 jip_rite_name_hadad_desc: "Hadad, lord of the storm, was the god of the Aramean kings of Damascus, who named themselves his sons. His rain makes the desert's edge bloom."
 jip_rite_name_atargatis: "Atargatism"
 jip_rite_name_atargatis_adj: "Atargatean"
 jip_rite_name_atargatis_adherent: "Atargatean"
 jip_rite_name_atargatis_adherent_plural: "Atargateans"
 jip_rite_name_atargatis_desc: "At Manbij the Syrian goddess Atargatis keeps her sacred lake, whose fish no one may eat; her priests carry her image through the cities of Syria."
 jip_rite_name_shamash: "Shamashism"
 jip_rite_name_shamash_adj: "Shamashite"
 jip_rite_name_shamash_adherent: "Shamashite"
 jip_rite_name_shamash_adherent_plural: "Shamashites"
 jip_rite_name_shamash_desc: "Shamash, the sun, sees every deed under heaven and judges it. At Hatra his temple stood behind walls that held off the legions of Rome."
 jip_rite_name_ishtar: "Ishtarism"
 jip_rite_name_ishtar_adj: "Ishtarite"
 jip_rite_name_ishtar_adherent: "Ishtarite"
 jip_rite_name_ishtar_adherent_plural: "Ishtarites"
 jip_rite_name_ishtar_desc: "Ishtar of Arbela, lady of battle and of love, spoke to the kings of Assyria through her prophetesses, and they marched at her word."
 jip_rite_name_nabu: "Nabuism"
 jip_rite_name_nabu_adj: "Nabuite"
 jip_rite_name_nabu_adherent: "Nabuite"
 jip_rite_name_nabu_adherent_plural: "Nabuites"
 jip_rite_name_nabu_desc: "Nabu holds the tablet of destinies and the scribe's stylus. His followers honour learning as worship, and copy the old texts so that nothing is lost."
 jip_rite_name_nergal: "Nergalism"
 jip_rite_name_nergal_adj: "Nergalite"
 jip_rite_name_nergal_adherent: "Nergalite"
 jip_rite_name_nergal_adherent_plural: "Nergalites"
 jip_rite_name_nergal_desc: "Nergal of Kutha rules the underworld and sends war and plague. His followers seek his favour on the battlefield, and fear it in the fever season."
 jip_rite_name_tammuz: "Tammuzism"
 jip_rite_name_tammuz_adj: "Tammuzite"
 jip_rite_name_tammuz_adherent: "Tammuzite"
 jip_rite_name_tammuz_adherent_plural: "Tammuzites"
 jip_rite_name_tammuz_desc: "Every summer the women weep for Tammuz, the shepherd who went down to the underworld, and every spring they rejoice at his return."
 jip_rite_name_nusku: "Nuskuism"
 jip_rite_name_nusku_adj: "Nuskuite"
 jip_rite_name_nusku_adherent: "Nuskuite"
 jip_rite_name_nusku_adherent_plural: "Nuskuites"
 jip_rite_name_nusku_desc: "Nusku, the flame of the lamp and the hearth, keeps the house safe through the night and carries the family's prayers to the great gods."
 jip_rite_name_enlil: "Enlilism"
 jip_rite_name_enlil_adj: "Enlilite"
 jip_rite_name_enlil_adherent: "Enlilite"
 jip_rite_name_enlil_adherent_plural: "Enlilites"
 jip_rite_name_enlil_desc: "Enlil, lord of the wind, gave kingship to the cities of the plain. His followers hold that rule is a gift of the gods, to be taken back from those who abuse it."
 jip_rite_name_chemosh: "Chemoshism"
 jip_rite_name_chemosh_adj: "Chemoshite"
 jip_rite_name_chemosh_adherent: "Chemoshite"
 jip_rite_name_chemosh_adherent_plural: "Chemoshites"
 jip_rite_name_chemosh_desc: "Chemosh was the god of Moab, who gave his people victory, as King Mesha wrote on his stone, when they had served him well."
 jip_rite_name_milcom: "Milcomism"
 jip_rite_name_milcom_adj: "Milcomite"
 jip_rite_name_milcom_adherent: "Milcomite"
 jip_rite_name_milcom_adherent_plural: "Milcomites"
 jip_rite_name_milcom_desc: "Milcom, the king of the gods of Ammon, was crowned with gold in Rabbath Ammon, the city on the edge of the desert."
 jip_rite_name_qos: "Qosism"
 jip_rite_name_qos_adj: "Qosite"
 jip_rite_name_qos_adherent: "Qosite"
 jip_rite_name_qos_adherent_plural: "Qosites"
 jip_rite_name_qos_desc: "Qos, the bow of the storm, was the god of Edom, whose kings bore his name; his shrines stood in the red mountains of Seir."
 jip_rite_name_eshmun: "Eshmunism"
 jip_rite_name_eshmun_adj: "Eshmunite"
 jip_rite_name_eshmun_adherent: "Eshmunite"
 jip_rite_name_eshmun_adherent_plural: "Eshmunites"
 jip_rite_name_eshmun_desc: "Eshmun of Sidon heals the sick. Pilgrims bathed in the sacred pools of his temple by the river Bostrenus and left offerings for the children he cured."
 jip_rite_name_adonis: "Adonism"
 jip_rite_name_adonis_adj: "Adonite"
 jip_rite_name_adonis_adherent: "Adonite"
 jip_rite_name_adonis_adherent_plural: "Adonites"
 jip_rite_name_adonis_desc: "At Byblos the river runs red each spring with the blood of Adonis, beloved of the Lady of Byblos, and the city mourns him and celebrates his return."
 jip_rite_name_dagon: "Dagonism"
 jip_rite_name_dagon_adj: "Dagonite"
 jip_rite_name_dagon_adherent: "Dagonite"
 jip_rite_name_dagon_adherent_plural: "Dagonites"
 jip_rite_name_dagon_desc: "Dagon, father of grain, was the god of the Philistine cities of the coast, Gaza and Ashdod, where his temples stood."
 jip_rite_name_hammon: "Hammonism"
 jip_rite_name_hammon_adj: "Hammonian"
 jip_rite_name_hammon_adherent: "Hammonian"
 jip_rite_name_hammon_adherent_plural: "Hammonians"
 jip_rite_name_hammon_desc: "Baal Hammon, the lord of the ram's horns, was the first god of Carthage; the children of the city were vowed to him at the tophet, and his followers keep his worship as the Punic forefathers did."
 jip_rite_name_melqart: "Melqartism"
 jip_rite_name_melqart_adj: "Melqartite"
 jip_rite_name_melqart_adherent: "Melqartite"
 jip_rite_name_melqart_adherent_plural: "Melqartites"
 jip_rite_name_melqart_desc: "Melqart, the king of the city, was Tyre's god, carried by its merchants to every harbour of the sea; his followers count wealth a sign of his favour."
 jip_rite_name_anat: "Anatism"
 jip_rite_name_anat_adj: "Anatite"
 jip_rite_name_anat_adherent: "Anatite"
 jip_rite_name_anat_adherent_plural: "Anatites"
 jip_rite_name_anat_desc: "Anat, the maiden of battle, waded in the blood of Baal's enemies. Her followers go to war as to a festival."
 jip_rite_name_astarte: "Astartism"
 jip_rite_name_astarte_adj: "Astartean"
 jip_rite_name_astarte_adherent: "Astartean"
 jip_rite_name_astarte_adherent_plural: "Astarteans"
 jip_rite_name_astarte_desc: "Astarte, the morning and evening star, is the lady of love and of the fields' plenty, honoured in the temples of every Phoenician city."
 jip_rite_name_kothar: "Kotharism"
 jip_rite_name_kothar_adj: "Kotharite"
 jip_rite_name_kothar_adherent: "Kotharite"
 jip_rite_name_kothar_adherent_plural: "Kotharites"
 jip_rite_name_kothar_desc: "Kothar-wa-Khasis, skilled and wise, built Baal's palace and forged his weapons. His followers prize craft and learning above all."
 jip_rite_name_asherah: "Asherism"
 jip_rite_name_asherah_adj: "Asherist"
 jip_rite_name_asherah_adherent: "Asherist"
 jip_rite_name_asherah_adherent_plural: "Asherists"
 jip_rite_name_asherah_desc: "Asherah, the mother of the gods, is honoured at the wooden poles that stand beside every altar and in every household."
