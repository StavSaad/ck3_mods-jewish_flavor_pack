l_english:
 # Mesopotamianism (mesopotamian_pagan, jip_canaanite_faith_types.txt) and its rites
 mesopotamian_pagan: "Mesopotamianism"
 mesopotamian_pagan_adj: "Mesopotamian"
 mesopotamian_pagan_adherent: "Mesopotamian"
 mesopotamian_pagan_adherent_plural: "Mesopotamians"
 mesopotamian_pagan_desc: "The gods of Assyria and Babylon outlived their empires by a thousand years, in the temples of Harran and the star-lore of the Sabians. Ashur and Marduk, Ishtar of Nineveh and Arbela, Sin of Harran and Hadad of the storm wait only for a ruler bold enough to rebuild their houses."

 ashurism: "Ashurism"
 ashurism_adj: "Ashurite"
 ashurism_adherent: "Ashurite"
 ashurism_adherent_plural: "Ashurites"
 ashurism_desc: "The rite of Ashur, the god who gave the king his crown and commanded him to widen the land. The king rules as Ashur's steward and high priest, and each spring, at the Akitu, the gods renew his kingship."

 sinism: "Sinism"
 sinism_adj: "Sinite"
 sinism_adherent: "Sinite"
 sinism_adherent_plural: "Sinites"
 sinism_desc: "The rite of the Aramean cities: Sin, the moon god of Harran, Hadad of the storm, Atargatis of the sacred pools of Manbij and Bel of Palmyra. Its priests read the will of the gods in the stars, and keep the mysteries the Sabians of Harran never let die."

