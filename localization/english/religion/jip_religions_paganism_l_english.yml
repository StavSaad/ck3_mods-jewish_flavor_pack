 kohanism: "Kohenism"
 kohanism_adj: "Kohenist"
 kohanism_adherent: "Kohenist"
 kohanism_adherent_plural: "Kohenists"
 kohanism_desc: "Kohenist Judaism emphasizes the paramount role of the Kohenim (priestly caste) in religious observance, focusing on the strict adherence to their hereditary duties and the eventual restoration of the Temple in Jerusalem. This faith prioritizes dynastic purity and the collection of tithes to support the priestly class, believing their sanctity is vital for the spiritual well-being of all Israel."
 fervor_loss_third_temple: "The Al-Aqsa Mosque was destroyed to rebuild the Jewish Temple"
 tenet_kehunah_name: "Kehunah"
 tenet_kehunah_desc: "The sons of Aaron are set apart from birth to serve before the Lord. Their purity must be guarded, their lineage kept unbroken, and the tithes of Israel given to sustain them, for through the Kohanim the blessing of the Temple flows to all the people."
