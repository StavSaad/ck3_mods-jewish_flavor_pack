l_english:
 # The Mandaeans (0.15 plan, section 3): common/decisions/jip_mandaean_decisions.txt, events/jip_mandaean_events.txt
 jip_mandaean_masbuta_decision: "Receive the Masbuta"
 jip_mandaean_masbuta_decision_desc: "All living water is a Jordan. Dressed in the white rasta, I will go down into the river with the priest, be immersed three times, drink of the water and receive the crown of myrtle, as the souls of the faithful are washed in the waters of light."
 jip_mandaean_masbuta_decision_tooltip: "A solemn baptism in living water"
 jip_mandaean_masbuta_decision_confirm: "Go down to the river"
 jip_mandaean_living_water_tt: "Your [capital|E] or your family's estate lies on a river: living water"
 jip_masbuta_modifier: "Baptised in Living Water"
 jip_masbuta_modifier_desc: "This character has received the Masbuta in a river's running water, and is clean in body and soul."

 jip_mandaean_copy_ginza_decision: "Copy the Ginza Rabba"
 jip_mandaean_copy_ginza_decision_desc: "The Great Treasure must not be lost. Every copy of the Ginza is made by a learned hand from an older one, and every copyist writes at its end a colophon naming those who copied it before them, back to the first. Let a new copy be made in our house, and our name be added to the line."
 jip_mandaean_copy_ginza_decision_tooltip: "A new copy of the Mandaean scripture, with your scribe's name in its colophon"
 jip_mandaean_copy_ginza_decision_confirm: "Begin the copy"
 jip_mandaean_copy_ginza_decision_effect_tt: "The most learned of you, your Ganzibra and your Mandaean [court_chaplain|E] copies the Ginza Rabba: you gain it as an [artifact|E] (+1 [learning|E], +0.5 monthly [piety|E] for Mandaeans)"
 jip_mandaean_ginza_scribe_tt: "You, your Ganzibra or your [court_chaplain|E] is a Mandaean with at least 12 [learning|E]"
 jip_artifact_ginza_rabba_name: "Ginza Rabba"
 jip_artifact_ginza_rabba_desc: "The Great Treasure of the Mandaeans, its Right half for the living and its Left for the souls' ascent, copied in a careful hand on good paper. The colophon gives the line of its copyists, ending with [Artifact.GetCreator.GetName]."
 jip_ginza_rabba_modifier: "The Ginza Rabba"

 jip_mandaean.0100.t: "The Haran Gawaita"
 jip_mandaean.0100.desc: "The priests have brought out an old scroll, the Haran Gawaita, and read it aloud at night for the young.\n\nIt tells how the Nasoraeans lived once in Jerusalem, and were hated and persecuted there for the truth they kept. So they left the city, sixty thousand of them, under the protection of King Ardban, and went out into the world."
 jip_mandaean.0100.a: "And where did they go?"
 jip_mandaean.0101.t: "The Inner Harran"
 jip_mandaean.0101.desc: "The Nasoraeans went to the inner Harran and the Median hills, the scroll says, a place where no other people ruled them, and there they kept their baptisms in the rivers for generations. Harran is a name our people have never forgotten, though those who live there now pray to the planets.\n\nThen, the reader says, Jerusalem fell, as was foretold, and the Nasoraeans came down from the hills."
 jip_mandaean.0101.a: "Read on."
 jip_mandaean.0102.t: "The Waters of Babylonia"
 jip_mandaean.0102.desc: "They came down to Babylonia and the land of Maishan, to the marshes and the great rivers, where the living water never runs dry. They built their mandis by the water, the scroll ends, and kept the treasure of the Ginza through every king and every faith that came after.\n\nThe young listen. What they remember of tonight will be what they hand down."
 jip_mandaean.0102.a: "We are the Nasoraeans, who kept faith through every flight."
 jip_mandaean.0102.b: "Harran sheltered us once. We are not strangers in the world."
 jip_haran_gawaita_modifier: "Keeper of the Haran Gawaita"
 jip_haran_gawaita_modifier_desc: "This character keeps the old scroll of the Mandaeans' wanderings, and the faith it tells of."

 jip_mandaean.0200.t: "The Planets of Harran"
 jip_mandaean.0200.desc: "Word has come from the north: at Harran [jip_harran_unveiler.GetTitledFirstName] has opened the Ehulhul and called the moon and the planets gods again, and the Sabians there no longer hide it.\n\nThe Muslims have long confused us with them, two peoples called Sabians. But the seven planets are the seven evil ones of Ruha's brood, who lead souls astray. Those who worship them are no Nasoraeans."
 jip_mandaean.0200.a: "Let it be known: we are not the Sabians of Harran."
 jip_mandaean.0200.b: "Their gods are their own affair."
 jip_mandaeans_disown_harran_opinion: "Worships the Planets"
