l_english:
 jewish_admin_family_government: "Mishpacha"
 jewish_admin_family_government_with_icon: "@government_type_nasi! $jewish_admin_family_government$"
 jewish_admin_family_government_adjective: "Mishpacha"
 jewish_admin_family_government_realm: "Jewish Family"
 jewish_admin_family_government_desc: "\n$game_concept_administrative_desc$\n\n#F Mishpacha — the Hebrew word for 'family' or 'clan' — is a form of governance rooted in the traditions of the Nasi (Prince) and the Exilarchate. A prominent Jewish family rules not through military conquest, but through communal authority, legal expertise, and the bonds of diaspora commerce.\n\nA Mishpacha ruler can hold court and exercise authority even without owning territory — the respect of the community and the weight of the Davidic line are their domain. The Exilarch, head of the Jewish exile, is the greatest expression of this tradition: a sovereign of a people, not merely of land.#!"
 jewish_admin_family_government_vassals_label: "[administrative|E] [obligations|E] are based on [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 jewish_admin_family_government_house_attribute_flavor_name: "[powerful_family_attribute|E]"
 jewish_admin_family_government_house_attribute_flavor_name_no_tooltip: "$game_concept_powerful_family_attribute$"