l_english:
 familial_government: "Familial"
 familial_government_with_icon: "@government_type_familial! $familial_government$"
 familial_government_adjective: "Familial"
 familial_government_realm: "Family"
 familial_government_desc: "\n$game_concept_familial_desc$\n\n#F Under the charters of kings and caliphs, the great Jewish houses kept their own courts, schools and synagogues, and served the rulers who protected them as financiers, physicians and envoys, as the Sabian and Mandaean houses of Iraq did their own.\n\nA family is remembered not by the land it holds, which is none, but by the name it keeps in every city its letters reach.#!"
 familial_government_potential_domicile: "$potential_domicile$"
 # The character finder's government filter
 familial_government_filter_option: "$game_concept_familial$"
 familial_government_filter_option_desc: "Only show characters with [familial|E] [government|E]"
 familial_government_vassals_label: "$familial_government$ families have no [vassals|E]: they pay their [merchant_patron|E] [taxes|E] rather than raising [levies|E]"
 familial_government_house_attribute_flavor_name: "[powerful_family_attribute|E]"
 familial_government_house_attribute_flavor_name_no_tooltip: "$game_concept_powerful_family_attribute$"
 familial_icon_concept: "[familial_i|E]"
 tributary_familial: "Patronage"
 tributary_familial_desc: "A [familial|E] family lives under the protection of the lord of its [estate|E]'s city, its patron: it pays them [taxes|E] and lends them [prestige|E], and is granted its rights in return. The tie passes to both sides' heirs, and the family can't break it, only move its [estate|E] to another lord's city."
 mishpacha_beit_din_rights: "Own Courts"
 mishpacha_beit_din_rights_none: "No Own Courts"
 mishpacha_beit_din_rights_none_short: "None"
 mishpacha_beit_din_rights_granted: "Own Courts Granted"
 mishpacha_beit_din_rights_granted_short: "Granted"
 mishpacha_beit_din_rights_granted_desc: "#emphasis #bold Privilege:#!#!\n$EFFECT_LIST_BULLET$ The community judges its own under its own law\n\n#flavor Disputes between the family's people are settled by their own court, a Beit Din for the Jews and the priests for the Sabians and Mandaeans, not the patron's.#!"
